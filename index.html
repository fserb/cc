<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nadya</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>

  body > header { display: flex; align-items: center; gap: 1.2rem; padding: 0 1.2rem; height: 48px; border-bottom: 1px solid var(--line); }
  body > header > b { font-size: 1.05rem; cursor: pointer; }

  .sum { margin-left: auto; color: var(--muted); font-size: 0.82rem; white-space: nowrap; }
  #qbtn { all: unset; cursor: pointer; display: flex; align-items: center; gap: 0.55rem; padding: 0.3rem 0.6rem; border-radius: 999px; font-variant-numeric: tabular-nums; } #qbtn:hover { background: var(--hover); }
  #qbtn .bar { position: relative; width: 84px; height: 6px; border-radius: 3px; background: var(--line); }
  #qbtn { --qc: var(--accent); } #qbtn.hi { --qc: var(--yel); } #qbtn.out { --qc: var(--red); }
  #qbtn .bar i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--qc); }
  #qbtn .bar s { position: absolute; top: calc(100% + 1px); width: 0; height: 0; margin-left: -4px; border: 4px solid transparent; border-top: 0; border-bottom: 5px solid var(--qc); }
  #qbtn b { color: var(--text); font-weight: 600; }
  #qbtn.out b, #qbtn.out em { color: var(--red); }
  #qbtn em { font-style: normal; }
  #home { display: grid; grid-template-columns: 320px minmax(0, 1fr); min-height: 0; }
  #left { border-right: 1px solid var(--line); overflow: auto; padding: 0.4rem 0 0; display: flex; flex-direction: column; }
  #left > * { flex-shrink: 0; }
  .addbar { position: sticky; bottom: 0; margin-top: auto; background: var(--bg); padding: 0.6rem 1.1rem calc(0.6rem + env(safe-area-inset-bottom)); }
  .sec { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); padding: 0.8rem 1.1rem 0.25rem; }
  .it { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 0 0.7rem; padding: 0.45rem 1.1rem; cursor: pointer; align-items: baseline; }
  .it:hover { background: var(--hover); }
  .it[aria-current=true] { background: var(--cur); }
  .it.hot { background: var(--hot); } .it.hot.red { background: var(--hot-red); } .it.hot[aria-current=true] { box-shadow: inset 3px 0 0 var(--accent); }
  .it .d { width: 8px; height: 8px; border-radius: 50%; align-self: center; }
  .d.red { background: var(--red); } .d.blue { background: var(--accent); } .d.green { background: var(--green); } .d.yel { background: var(--yel); } .d.gray { background: var(--gray); }
  .it .tx div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .it .tx small { display: block; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.82rem; }
  .it.hot .tx div, .it.unread .tx div { font-weight: 600; }
  .it time { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
  #center { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; }
  #view { overflow: auto; grid-area: 1 / 1; }
  #newer { grid-area: 1 / 1; align-self: end; justify-self: center; margin-bottom: 0.8rem; border: 0; background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 0.35rem 1rem; font: inherit; font-size: 0.85rem; cursor: pointer; box-shadow: 0 1px 4px #0003; }
  article { max-width: 46rem; margin: 0 auto; padding: 1.6rem 2rem 2rem; }

  .meta { color: var(--muted); margin-bottom: 1rem; font-size: 0.88rem; }

  pre { background: var(--pre-bg); color: var(--pre-fg); padding: 0.8rem 1rem; border-radius: 6px; font: 12.5px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
  .need { border-left: 4px solid var(--accent); background: var(--need); border-radius: 0 6px 6px 0; padding: 0.7rem 0.9rem; margin: 1rem 0; } .need.red { border-color: var(--red); background: var(--need-red); } .need p { margin: 0.2rem 0 0; white-space: pre-line; } .need p.suggest { color: var(--muted); }
  .opts { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.6rem 0 0; }
  .opts button { font: inherit; text-align: left; border: 1px solid var(--accent); color: var(--accent); background: #fff; border-radius: 6px; padding: 0.35rem 0.9rem; cursor: pointer; }
  .opts button:first-child { background: var(--accent); color: var(--on-accent); }

  .need .free { display: flex; gap: 0.4rem; margin: 0.5rem 0 0; } .need .free input { flex: 1; min-width: 0; font: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 0.35rem 0.7rem; } .need .free button { font: inherit; border: 1px solid var(--accent); color: var(--accent); background: #fff; border-radius: 6px; padding: 0.35rem 0.9rem; cursor: pointer; }
  .done { color: var(--green); font-weight: 600; } .err { color: var(--red); }
  .msgs { display: flex; flex-direction: column; gap: 0.5rem; }
  .m { align-self: flex-start; max-width: 78%; padding: 0.5rem 0.8rem; border-radius: 12px; background: var(--bubble); overflow-wrap: anywhere; } .m.me { align-self: flex-end; background: var(--accent); color: var(--on-accent); } .m.me small { text-align: right; }
  .m.me.pend { opacity: 0.5; } .m.me.fail { background: var(--red); opacity: 0.85; cursor: pointer; }
  .m small { display: block; text-align: left; font-size: 0.6rem; opacity: 0.7; margin-top: 0.15rem; }
  .m p { margin: 0 0 0.4rem; } .m p:last-of-type { margin: 0; } .m ul { margin: 0.2rem 0 0.4rem; padding-left: 1.2rem; } .m code { font: 0.88em var(--mono); }
  .typing { align-self: flex-start; display: flex; gap: 4px; padding: 0.75rem 0.9rem; border-radius: 12px; background: var(--bubble); }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: bob 1.2s ease-in-out infinite; animation-delay: var(--t, 0s); }
  .typing i:nth-child(2) { animation-delay: calc(var(--t, 0s) + 0.15s); } .typing i:nth-child(3) { animation-delay: calc(var(--t, 0s) + 0.3s); }
  @keyframes bob { 0%, 60%, 100% { opacity: 0.3; transform: none; } 30% { opacity: 1; transform: translateY(-3px); } }
  .tools { align-self: flex-start; font-size: 0.78rem; color: var(--muted); padding: 0 0.8rem; }
  #say[hidden] { display: none; }
  #say { display: flex; gap: 0.5rem; padding: 0.7rem 2rem 0.9rem; border-top: 1px solid var(--line); }
  #say input { flex: 1; font: inherit; border: 1px solid var(--line); border-radius: 999px; padding: 0.55rem 1rem; }
  #say button { border: 0; background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 0 1.1rem; cursor: pointer; font: inherit; }
  #say .note { font-size: 0.78rem; color: var(--muted); align-self: center; }
  #back { display: none; }
  details summary { cursor: pointer; }
  .big { font-size: 2.2rem; font-weight: 700; line-height: 1.1; }
  .meter { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 0.4rem 0 1rem; } .qg .meter { margin: 0.4rem 0 0.5rem; }
  .qm { position: relative; } .qm s { position: absolute; top: calc(100% + 1px); width: 0; height: 0; margin-left: -5px; border: 5px solid transparent; border-top: 0; border-bottom: 6px solid var(--qc); } .meter i { display: block; height: 100%; }
  .h { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 1.4rem 0 0.4rem; }
  .rows { list-style: none; padding: 0; margin: 0; } .rows li { display: flex; gap: 0.8rem; align-items: baseline; padding: 0.45rem 0; border-bottom: 1px solid var(--line); } .rows li small { margin-left: auto; color: var(--muted); white-space: nowrap; }
  .tabs { display: flex; gap: 0.3rem; margin: 1.4rem 0 0.6rem; } .tabs button { font: inherit; font-size: 0.85rem; border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 999px; padding: 0.25rem 0.9rem; cursor: pointer; } .tabs button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .bp summary, .bs { display: grid; grid-template-columns: minmax(0, 9rem) minmax(0, 1fr) 3.4rem; gap: 0.7rem; align-items: center; padding: 0.35rem 0; font-variant-numeric: tabular-nums; }
  .bp summary { list-style: none; border-bottom: 1px solid var(--line); } .bp summary::-webkit-details-marker { display: none; }
  .bp summary .nm::before { content: "▸ "; color: var(--muted); } .bp[open] > summary .nm::before { content: "▾ "; }
  .bp .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .bp b { text-align: right; font-weight: 600; } .bs b { font-weight: 400; color: var(--muted); }
  .bs { padding-left: 1rem; font-size: 0.88rem; } .bs small { color: var(--muted); }
  .bb { display: flex; height: 10px; border-radius: 3px; background: var(--track); overflow: hidden; } .bb i { display: block; height: 100%; background: var(--accent); } .bs .bb i { opacity: 0.55; } .bd > summary .bb { background: none; } .qw { display: flex; flex-wrap: wrap; justify-content: space-between; column-gap: 1rem; } .qw span:last-child:not(:first-child) { margin-left: auto; }
  .bp .bp { margin-left: 1rem; } .bp .bp summary { font-size: 0.9rem; }
  .legend { display: flex; flex-wrap: wrap; gap: 0.3rem 0.9rem; font-size: 0.8rem; color: var(--muted); margin: 0.2rem 0 0.6rem; } .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 0.3rem; }
  .qh { font-size: 0.85rem; font-weight: 600; color: var(--muted); margin: 1.6rem 0 0.4rem; }
  .qg { margin: 0; } .qd { position: relative; height: 1.2em; font-size: 0.72rem; color: var(--muted); } .qd span { position: absolute; top: 0.1em; padding-left: 3px; }
  .rows li.go { cursor: pointer; } .rows li.go:hover span { color: var(--accent); }
  .m h1, .m h2, .m h3, .m h4 { font-size: 1em; margin: 0 0 0.3rem; } .m ol { margin: 0.2rem 0 0.4rem; padding-left: 1.4rem; } .m .tbl { margin: 0.3rem 0; }
  .doc h2 { font-size: 1.2rem; margin: 1.8rem 0 0.5rem; } .doc h3 { font-size: 1.02rem; margin: 1.4rem 0 0.4rem; } .doc h4 { font-size: 0.95rem; margin: 1.2rem 0 0.3rem; }
  .doc p, .doc ul, .doc ol { margin: 0 0 0.8rem; } .doc ul, .doc ol { padding-left: 1.4rem; } .doc li { margin: 0.2rem 0; } .doc li > ul, .doc li > ol { margin: 0.2rem 0 0; }
  .doc a { color: var(--accent); } .doc :not(pre) > code { font: 0.88em var(--mono); background: var(--hover); padding: 0.05em 0.25em; border-radius: 3px; }
  .tbl { overflow-x: auto; margin: 0 0 1rem; } .tbl table { border-collapse: collapse; font-size: 0.86rem; } .tbl th, .tbl td { border: 1px solid var(--line); padding: 0.35rem 0.55rem; text-align: left; vertical-align: top; min-width: 7rem; } .tbl th { background: var(--track); }
  .rows li.x span { text-decoration: line-through; color: var(--muted); }
  .add { all: unset; box-sizing: border-box; display: block; width: 100%; padding: 0.35rem 0; text-align: center; font-size: 1.3rem; line-height: 1.2; color: var(--muted); border: 1px dashed var(--gray); border-radius: 6px; cursor: pointer; }
  .add:hover, .add[aria-current=true] { color: var(--accent); border-color: var(--accent); background: var(--cur); }
  #new { display: grid; gap: 0.9rem; max-width: 28rem; }
  #new label { display: grid; gap: 0.2rem; font-size: 0.85rem; color: var(--muted); }
  #new input, #new select { font: inherit; font-size: 16px; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 0.5rem 0.7rem; }
  .seg { border: 0; padding: 0; margin: 0; display: flex; } .seg legend { padding: 0; margin-bottom: 0.2rem; font-size: 0.85rem; color: var(--muted); }
  #new .seg label { display: block; flex: 1; font-size: 15px; } #new .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span { display: block; text-align: center; padding: 0.5rem 0.7rem; border: 1px solid var(--line); color: var(--text); cursor: pointer; user-select: none; }
  .seg label:first-of-type span { border-radius: 6px 0 0 6px; } .seg label:last-of-type span { border-radius: 0 6px 6px 0; border-left: 0; }
  .seg input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--on-accent); } .seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  #new button { justify-self: start; font: inherit; border: 0; background: var(--accent); color: var(--on-accent); border-radius: 6px; padding: 0.5rem 1.4rem; cursor: pointer; }
  #new button:disabled { opacity: 0.5; cursor: default; }
  #view iframe { display: block; width: 100%; height: 100%; border: 0; }
  #view:has(iframe) { overflow: hidden; }
  @media (max-width: 760px) {
    body > header { gap: 0.5rem; padding: 0 0.6rem; } #qbtn .bar { width: 56px; }
    #home { display: block; position: relative; }
    #left, #center { position: absolute; inset: 0; } #center { display: none; }
    body.view #center { display: grid; } body.view #left { display: none; }
    #back { display: inline-flex; all: unset; cursor: pointer; font-size: 1.4rem; padding: 0 0.3rem; } body:not(.view) #back { visibility: hidden; }
    #left { border-right: 0; } .addbar { padding: 0; } .add { border-width: 1px 0 0; border-radius: 0; padding: 0.6rem 0 calc(0.6rem + env(safe-area-inset-bottom)); }
    article { padding: 1rem; } #say { padding: 0.6rem 0.8rem calc(0.7rem + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<header><button id="back" aria-label="back">‹</button><b id="title">nadya</b><span class="sum" id="sum"></span></header>
<section id="home">
  <nav id="left"></nav>
  <section id="center"><div id="view"></div><button id="newer" hidden>↓ new</button><form id="say"><input name="q" autocomplete="off"><button>send</button></form></section>
</section>
<script type="module">
// A static page (no box): everything it shows comes from these, all same origin:
//   ../ccx/api/...        sessions on every host: list + events (SSE), log, screen, pick, type
//   ../blog/              the blog (its #posts are inserted here), asks.json, POST answer
//   files/                todo.md, ideas/, projects/, research/: links to ~/nadya (caddy lists the dirs)
const CCX = "../ccx/api";
const BLOG = "../blog/";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);
const S = {rows: [], usage: null, burn: null, asks: [], posts: [], todo: [], ideas: [], projects: [], log: [], screens: {}};
// the open item lives in the URL, so a refresh reopens it: #blog, #marx.1234 (an old #blog/arc opens the blog)
const hash = decodeURIComponent(location.hash.slice(1));
const isDoc = (c) => /^(idea|project)\//.test(c ?? "");  // idea/<file> opened from plan, project/<file> from projects
const hashCur = isDoc(hash) ? hash : hash.split("/")[0];
let cur = hashCur || (innerWidth > 760 ? "nadya" : null);
const isPid = (c) => c?.includes(".") && !isDoc(c);  // marx.1234
function setHash() { if (cur) history.replaceState(history.state, "", `#${cur}`); }
const sent = new Map();  // ask id / item -> what was sent, for "✓" lines

// ---------- helpers
function ago(t) {
  const s = Math.max(0, Date.now() / 1000 - t);
  if (s < 60) return `${Math.round(s)}s`;
  if (s < 3600) return `${Math.floor(s / 60)}min`;
  if (s < 86400) return `${Math.floor(s / 3600)}h`;
  return `${Math.floor(s / 86400)}d`;
}
const hhmm = (t) => new Date(t * 1000).toLocaleTimeString("en-CA", {hour: "2-digit", minute: "2-digit", hour12: false});
// bare http(s) URLs in escaped text become links; skips ones already in an href or link text, and trailing punctuation
const autolink = (s) => s.replace(/(^|[^"=>\w])(https?:\/\/[^\s<"]+?)(?=[.,;:!?)\]]*(?:\s|<|&quot;|&gt;|&#39;|$))/g, (m, pre, u) => `${pre}<a href="${u}">${u}</a>`);
function md(text, doc) {
  // a small markdown subset: # headings, paragraphs, - and 1. lists (nested by indent), ``` code, | tables,
  // **bold**, *italic*, `code`, links. doc: hard-wrapped lines join into one paragraph (chat keeps its line breaks)
  const link = (m, t, u) => /^https?:/.test(u) ? `<a href="${u}">${t}</a>` : doc && /^[\w.-]+\.md$/.test(u) ? `<a href="#idea/${u}" data-go="idea/${u}">${t}</a>` : t;
  const inline = (s) => {
    const code = [];  // code spans wait outside, so ** and _ inside them stay as typed
    return esc(s).replace(/`([^`]+)`/g, (m, c) => `\0${code.push(c) - 1}\0`)
      .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^\w*])\*(?=\S)(.+?)\*(?!\w)/g, "$1<i>$2</i>").replace(/(^|\W)_(?=\S)(.+?)_(?!\w)/g, "$1<i>$2</i>")
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, link).replace(/^.*$/s, autolink).replace(/\0(\d+)\0/g, (m, k) => `<code>${code[k]}</code>`);
  };
  const cells = (row) => row.trim().replace(/^\||\|$/g, "").split("|").map((c) => inline(c.trim()));
  const out = [], lists = [];
  let para = [];
  const endPara = () => { if (para.length) out.push(`<p>${para.join(doc ? " " : "<br>")}</p>`); para = []; };
  const endLists = (ind = -1) => { while (lists.length && lists.at(-1).ind > ind) out.push(`</li></${lists.pop().tag}>`); };
  const lines = text.trim().split("\n");
  for (let k = 0; k < lines.length; k++) {
    const line = lines[k];
    if (!line.trim()) { endPara(); if (!/^\s+\S/.test(lines[k + 1] ?? "")) endLists(); continue; }
    if (line.startsWith("```")) {
      endPara(); endLists();
      const code = [];
      while (++k < lines.length && !lines[k].startsWith("```")) code.push(lines[k]);
      out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`); continue;
    }
    const h = line.match(/^(#{1,4}) (.*)$/);
    if (h) { endPara(); endLists(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); continue; }
    if (line.startsWith("|") && /^\|?[\s:|-]+$/.test(lines[k + 1] ?? "") && lines[k + 1].includes("-")) {
      endPara(); endLists();
      const head = cells(line), body = [];
      for (k += 2; k < lines.length && lines[k].startsWith("|"); k++) body.push(cells(lines[k]));
      k--;
      out.push(`<div class="tbl"><table><thead><tr>${head.map((c) => `<th>${c}</th>`).join("")}</tr></thead><tbody>${body.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    const li = line.match(/^(\s*)([-*]|\d+\.) (.*)$/);
    if (li) {
      endPara();
      const ind = li[1].length, tag = /\d/.test(li[2]) ? "ol" : "ul";
      endLists(ind);
      const top = lists.at(-1);
      if (top?.ind === ind && top.tag === tag) out.push("</li>");
      else { if (top?.ind === ind) endLists(ind - 1); lists.push({ind, tag}); out.push(`<${tag}>`); }
      out.push(`<li>${inline(li[3])}`); continue;
    }
    if (lists.length && /^\s/.test(line)) { out[out.length - 1] += `${doc ? " " : "<br>"}${inline(line.trim())}`; continue; }
    endLists(); para.push(inline(line));
  }
  endPara(); endLists();
  return out.join("");
}
async function json(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error(`${r.status} ${(await r.text()).slice(0, 200)}`);
  return r.json();
}
const post = (url, body) => json(url, {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify(body)});
const nadyaRow = () => S.rows.find((r) => r.name === "nadya" && r.pid.startsWith("nadya."));

// ---------- data
async function loadUsage() { S.usage = (await json(`${CCX}/usage`).catch(() => null))?.usage ?? S.usage; draw(); if (cur === "quota") loadBurn(); }
async function loadBurn() {
  const [b, d] = await Promise.all([`${CCX}/burn`, `${CCX}/burn?hours=24`].map((u) => json(u).catch((e) => ({error: e.message}))));
  if (!b.error || !S.burn) S.burn = b;
  if (!d.error || !S.burn24) S.burn24 = d;
  drawView(true);
}
async function loadAsks() { S.asks = (await json(`${BLOG}asks.json`, {cache: "no-cache"}).catch(() => null))?.asks ?? S.asks; draw(); }
async function loadBlog() {
  const html = await fetch(BLOG, {cache: "no-cache"}).then((r) => r.text()).catch(() => "");
  const doc = new DOMParser().parseFromString(html, "text/html");
  const posts = doc.querySelector("#posts");
  if (!posts) return;
  S.posts = [...posts.querySelectorAll("article")].map((a) => ({title: a.querySelector("h2")?.textContent.trim(), time: a.querySelector("time")?.textContent.trim()}));
  draw();
}
async function loadTodo() {
  const text = await fetch("files/todo.md", {cache: "no-cache"}).then((r) => r.ok ? r.text() : "").catch(() => "");
  S.todo = [...text.matchAll(/^- \[(.)\] (?:(\d{4}-\d\d-\d\d)(?: (\d\d:\d\d))? )?(.*)$/gm)].map(([, mark, date, time, rest]) => {
    const due = date ? new Date(`${date}T${time ?? "09:00"}`) : null;
    return {mark, date, time, due, text: rest.split(/\. |\(user/)[0].trim(), full: rest};
  }).filter((t) => t.mark !== "x");
  [S.ideas, S.projects] = await Promise.all([loadDocs("ideas"), loadDocs("projects")]);
  draw();
}
async function loadDocs(dir) {
  // every .md in files/<dir>/ (caddy's listing): # title, Status: line
  const list = await fetch(`files/${dir}/`, {cache: "no-cache"}).then((r) => r.ok ? r.text() : "").catch(() => "");
  const files = [...new Set([...list.matchAll(/href="(?:\.\/)?([\w.-]+\.md)"/g)].map((m) => m[1]))];
  return Promise.all(files.map(async (f) => {
    const t = await fetch(`files/${dir}/${f}`, {cache: "no-cache"}).then((r) => r.text()).catch(() => "");
    return {file: f, text: t, title: t.match(/^# (.+)$/m)?.[1] ?? f, status: t.match(/^Status: ([^.(]+)/m)?.[1]?.trim() ?? ""};
  }));
}
function listen() {

}
// one session stream at a time: the open one (log for nadya, screen + dialog for all)
let stream = null;
function follow(pid) {
  if (stream?.pid === pid) return;
  // a dialog is known only while its session's stream is open: a closed one keeps no old dialog
  if (stream) { stream.es.close(); delete S.screens[stream.pid]?.dialog; }
  stream = null;
  if (!pid) return;
  S.log = [];
  const es = new EventSource(`${CCX}/s/${pid}/events`);
  stream = {pid, es};
  json(`${CCX}/s/${pid}/log`).then((d) => { if (stream?.pid === pid && !S.log.length) { S.log = d.events; ackPending(); drawView(); } }).catch(() => {});
  es.addEventListener("log", (e) => { const d = JSON.parse(e.data); S.log = d.reset ? d.events : S.log.concat(d.events); ackPending(); drawView(true); });
  es.addEventListener("screen", (e) => { (S.screens[pid] ??= {}).text = JSON.parse(e.data).text; drawView(true); });
  es.addEventListener("dialog", (e) => { (S.screens[pid] ??= {}).dialog = JSON.parse(e.data); drawView(true); draw(); });
}

// ---------- what waits on the user

const day = (d) => d.toLocaleString("en-CA", {weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false});

    sub: n && hasDialog(n) ? `waits on a dialog: ${n.asking || "see pane"}` : nAsks[0] ? nAsks[0].text : lastText?.text.split("\n")[0] ?? (n ? n.summary : "not running"), t: n ? ago(n.since) : ""});
  if (!localStorage.cc_blog_seen && S.posts.length) localStorage.cc_blog_seen = Date.now();

  const due = dueTodos();

  const ps = projects(), run = ps.filter((x) => x.running).length;

    title: r.name, sub: dialog ? `waits on a dialog: ${r.asking || "see pane"}` : asks[0] ? asks[0].text : r.summary !== r.name ? r.summary : r.path, t: `${r.pid.split(".")[0] === "nadya" ? "" : r.pid.split(".")[0] + " · "}${ago(r.since)}`});

}
function draw() {
  const all = items();
  let sec = null, html = "";
  for (const i of all) {
    if ((i.sec ?? "") !== sec) { sec = i.sec ?? ""; html += sec ? `<div class="sec">${sec}</div>` : `<div style="height:.4rem"></div>`; }
    html += `<div class="it ${i.unread ? "unread" : ""} ${i.hot ? "hot " + i.d : ""}" data-id="${esc(i.id)}" aria-current="${i.id === (isDoc(cur) ? docParent(cur) : cur)}"><span class="d ${i.d}"></span><span class="tx"><div>${esc(i.title)}</div><small>${esc(i.sub)}</small></span><time>${esc(i.t)}</time></div>`;

  html += `<div class="addbar"><button class="add" id="add" aria-label="new session" title="start a new claude session" aria-current="${cur === "new"}">+</button></div>`;
  $("#left").innerHTML = html;

  const even = u ? Math.min(100, Math.max(0, (Math.min(Date.now(), u.resetsAt) - (u.resetsAt - 7 * 86400e3)) / (7 * 86400e3) * 100)) : 0;

  $("#sum").innerHTML = `<button id="qbtn" class="${p?.out ? "out" : p?.x > 1 ? "hi" : ""}" title="${esc(tip)}" aria-label="${esc(tip)}"><span class="bar"><i style="width:${u?.used ?? 0}%"></i>${u ? `<s style="left:${even.toFixed(1)}%"></s>` : ""}</span><b>${u ? u.used + "%" : "?"}</b>${p ? `<em>${p.x.toFixed(1)}x${p.out ? ` · out ${day(p.out)}` : ""}</em>` : ""}</button>`;

// ---------- center
let lastView = "";

const atBottom = (v) => v.scrollHeight - v.scrollTop - v.clientHeight < 40;

// the typing bubble as last drawn: a reply up to 5 s later still grows out of it (the state can turn idle before the log has the reply)
let dots = null;
function drawView(soft) {
  const i = items().find((x) => x.id === cur);
  const view = $("#view");
  noteScroll();
  const keep = atBottom(view) || Date.now() - pausedAt > 30e3;
  const {scrollTop} = view, pane = view.querySelector("details")?.open, msgs = view.querySelector(".msgs")?.innerHTML;
  let html, ph = "Message nadya";
  if (cur === "quota") html = quotaView();

  else if (cur === "plan") html = todoView();

  else if (isDoc(cur)) html = docView(...cur.split("/"));

  if (soft && html === lastView) return;
  if (soft && cur === "blog") return;  // don't rebuild the blog under the reader
  lastView = html;
  const t = soft && view.querySelector(".typing");
  if (t) dots = {cur, at: Date.now(), said: view.querySelectorAll(".m:not(.me)").length, rect: t.getBoundingClientRect()};
  view.innerHTML = html;
  // keep the dots' bounce going across redraws; a reply that arrives grows out of the dots bubble
  view.querySelector(".typing")?.style.setProperty("--t", `-${Date.now() % 1200}ms`);
  const reply = dots?.cur === cur && Date.now() - dots.at < 5e3 && view.querySelectorAll(".m:not(.me)")[dots.said];

  $("#say").hidden = !(!cur || cur === "nadya" || i?.r);  // the prompt only where it talks to nadya or a session
  const chatty = !cur || cur === "nadya" || isPid(cur);

function grow(el, from) {

  const ease = {duration: 350, easing: "cubic-bezier(0.2, 0.8, 0.2, 1)"};
  el.animate([{clipPath: `inset(0 ${Math.max(0, width - from.width)}px ${Math.max(0, height - from.height)}px 0 round 12px)`}, {clipPath: "inset(0 round 12px)"}], ease);
  for (const c of el.children) c.animate([{opacity: 0}, {opacity: 0, offset: 0.4}, {opacity: 1}], ease);

// Claude Code wraps pasted text in <pasted_content id="..."> ... </pasted_content id="...">: show only the text
const unpaste = (t) => t.replace(/<\/?pasted_content(?: id="[^"]*")?>\n?/g, "");
// messages sent from this page, shown at once and dropped when the session's log has them
let pending = [], pendId = 0;
const norm = (t) => unpaste(t).replace(/\s+/g, " ").trim();
function ackPending() {
  if (!stream || !pending.length) return;
  const seen = S.log.filter((e) => e.type === "user").map((e) => ({at: e.at * 1000, t: norm(e.text)}));
  pending = pending.filter((p) => {
    if (p.err || p.pid !== stream.pid) return true;
    const t = norm(p.text);
    // a log entry acks one bubble only (the same text sent twice); 10 s for clock skew between hosts
    const k = seen.findIndex((e) => e.at > p.at - 10e3 && (e.t.includes(t) || (e.t.length >= 40 && t.startsWith(e.t.slice(0, 200)))));
    if (k >= 0) seen.splice(k, 1);
    return k < 0;
  });
}
// a session's transcript as a chat, the same for nadya and every other session
function chat(r) {
  const sc = S.screens[r.pid] ?? {};
  const log = stream?.pid === r.pid ? S.log : [];
  // tool calls after a message go on that message's time line: "16:34 · 3 tool calls"; on the user's (right-aligned) side "3 tool calls · 16:34"
  const msgs = []; let tools = 0;
  const flush = () => {
    if (!tools) return;
    const note = `${tools} tool call${tools > 1 ? "s" : ""}`;
    msgs.length ? msgs.at(-1).note = note : msgs.push({tools: note});
    tools = 0;
  };
  for (const e of log) {
    if (e.type === "tool") { tools++; continue; }
    if (e.type !== "user" && e.type !== "text") continue;
    flush();
    msgs.push({me: e.type === "user", body: e.type === "user" ? autolink(esc(unpaste(e.text).length > 600 ? unpaste(e.text).slice(0, 600) + "…" : unpaste(e.text))) : md(e.text), small: hhmm(e.at)});
  }
  flush();

  for (const p of pending.filter((x) => x.pid === r.pid)) {
    const note = p.err ? `not sent: ${esc(p.err)} · tap to dismiss` : Date.now() - p.at > 120e3 ? "not seen yet" : "sending…";
    out.push(`<div class="m me ${p.err ? "fail" : "pend"}" data-pend="${p.id}">${esc(p.text.length > 600 ? p.text.slice(0, 600) + "…" : p.text)}<small>${note}</small></div>`);

}
function nadyaView() {

const docParent = (c) => c.startsWith("project/") ? "projects" : "plan";
function projects() {

  const live = new Set(S.rows.map((r) => r.name)), order = ["running", "todo"];
  const rank = (x) => (order.indexOf(x.state) + 3) % 3 + (x.state === "done") * 3;  // running, todo, other words, done

    const r = await post(`${CCX}/spawn`, {dir: `${f.host.value}:${dir}`, name: f.name.value.trim(), beside: true});
    if (!r.pid) throw new Error(r.error ?? "no pid");
    for (let end = Date.now() + 15e3; !S.rows.some((x) => x.pid === r.pid) && Date.now() < end;) await new Promise((ok) => setTimeout(ok, 300));
    cur = r.pid; push(); open();
  } catch (err) {
    msg.className = "err"; msg.textContent = err.message;
    f.querySelector("button").disabled = false;
  }
});

let qTab = "24h";
const qOpen = new Set();  // the open rows of the quota view, kept across redraws
const TOPN = 5;  // projects with their own row in the usage breakdown; the rest go into "others"
// one color per project on the page: the PCOL.length busiest over all burn data (weeks and days) by rank, the rest gray.
// Tableau 20 without its two grays (gray is "others"), the dark half first
const PCOL = ["#4e79a7", "#f28e2b", "#59a14f", "#e15759", "#b07aa1", "#499894", "#b6992d", "#d37295", "#9d7660",
  "#a0cbe8", "#ffbe7d", "#8cd17d", "#ff9d9a", "#d4a6c8", "#86bcb6", "#f1ce63", "#fabfd2", "#d7b5a6"];
let pcolMap = null;
function projColors(b) {
  if (pcolMap) return pcolMap;
  const tot = new Map();
  for (const w of [...b.weeks, ...b.days]) for (const x of merged(w.projects ?? [])) tot.set(x.p, (tot.get(x.p) ?? 0) + x.w);
  const ranked = [...tot].filter(([, w]) => w > 0).sort((a, b) => b[1] - a[1]);
  pcolMap = new Map(ranked.slice(0, PCOL.length).map(([p], n) => [p, PCOL[n]]));
  return pcolMap;
}
function quotaView() {
  const u = S.usage, p = pace();
  if (!u) return `<article><h1>quota</h1><p class="meta">no usage data</p></article>`;
  const h = u.history.filter((x) => x.resetsAt === u.resetsAt);
  const W = 600, H = 120, t0 = u.resetsAt - 7 * 86400e3;
  const days = [];
  for (let d = new Date(t0); d.setHours(24, 0, 0, 0) < u.resetsAt;) days.push(new Date(d));
  const X = (t) => (t - t0) / (7 * 86400e3) * W;
  // both the curve's end and the tick are now: u.at is only when one host's file was written, hours old when idle
  const now = Math.min(Date.now(), u.resetsAt);
  const pts = [...h, {at: now, used: u.used}].map((x) => `${(X(x.at)).toFixed(1)},${(H - x.used / 100 * H).toFixed(1)}`).join(" ");
  return `<article><h1>quota</h1><div class="meta">${p ? `${p.x.toFixed(1)}x the pace that lasts to the reset · ` : ""}${p?.out ? `<b class="err">runs out ${day(p.out)}</b> · ` : ""}reset ${day(new Date(u.resetsAt))}</div>
    <div class="big" style="color:${p?.out ? "var(--red)" : "inherit"}">${u.used}%</div>
    <figure class="qg" style="--qc:${p?.out ? "var(--red)" : "var(--accent)"}"><div class="qm"><div class="meter"><i style="width:${u.used}%;background:var(--qc)"></i></div><s style="left:${X(now) / W * 100}%"></s></div><svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible" aria-label="quota used this week">${days.map((d) => `<line x1="${X(d).toFixed(1)}" y1="0" x2="${X(d).toFixed(1)}" y2="${H}" stroke="var(--gray)" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join("")}<line x1="0" y1="${H}" x2="${W}" y2="0" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/>${pts ? `<circle cx="${pts.split(" ").at(-1).split(",")[0]}" cy="${pts.split(" ").at(-1).split(",")[1]}" r="3.5" fill="var(--accent)"/>` : ""}</svg>
    <div class="qd">${days.map((d) => `<span style="left:${(X(d) / W * 100).toFixed(2)}%">${d.toLocaleDateString(undefined, { weekday: "short" })}</span>`).join("")}</div></figure>
    <p class="meta">The dashed line is the even pace from the start of the week to the reset.</p>${burnView()}</article>`;
}
// who used it (ccx api/burn): last week | this week | last 24h, then the days below, a row per project, its sessions on tap.
// A % is of the limit: a project's share of the window's weighted tokens times what the log added
// over it; a window with no log shows the share of its tokens instead
function burnView() {
  const b = S.burn;
  const tabs = `<div class="tabs" role="group" aria-label="window">${[["last", "last week"], ["this", "this week"], ["24h", "last 24h"]].map(([k, l]) => `<button data-qt="${k}" aria-pressed="${qTab === k}">${l}</button>`).join("")}</div>`;
  if (!b) return `${tabs}<p class="meta">loading…</p>`;
  if (b.error) return `${tabs}<p class="meta err">${esc(b.error)}</p>`;
  // last 24h and days: % of a day's even share (the limit / 7), so 100% is on pace
  const perDay = (w) => (w === S.burn24 || b.days.includes(w)) && w.used != null ? 7 : 1;
  const val = (w, x) => fmtQ(w.used == null ? x.share : x.q * perDay(w));
  const down = b.down?.length ? `<p class="meta err">${b.down.map(([host, e]) => esc(`${host}: ${e}`)).join("<br>")}</p>` : "";
  // the TOPN busiest projects of the window, the rest in one "others" row, last
  const group = (w) => {
    const ps = merged(w.projects).filter((x) => x.w > 0).sort((a, b) => b.w - a.w);
    const shown = ps.slice(0, TOPN), rest = ps.slice(TOPN);
    if (rest.length < 2) return shown.concat(rest);
    const sum = (f) => rest.reduce((a, x) => a + (x[f] ?? 0), 0);
    return shown.concat({p: "others", w: sum("w"), q: sum("q"), share: sum("share"), others: rest});
  };
  const cmap = projColors(b), pcol = (x) => (!x.others && cmap.get(x.p)) || "var(--gray)";
  const list = (w, key) => {
    const max = Math.max(1, ...group(w).map((x) => x.w));
    const sub = (x) => x.others ? x.others.map((o) => ({n: o.p, w: o.w, q: o.q, share: o.share})) : x.sessions.filter((s) => s.w >= max / 1000);
    return group(w).map((x) => { const k = `${key}/${x.p}`; return `<details class="bp" data-k="${esc(k)}" ${qOpen.has(k) ? "open" : ""}><summary><span class="nm">${x.others ? `<i>others</i> <small>${x.others.length}</small>` : esc(x.p)}</span><span class="bb"><i style="width:${(x.w / max * 100).toFixed(1)}%;background:${pcol(x)}"></i></span><b>${val(w, x)}</b></summary>${sub(x).map((s) => `<div class="bs"><span class="nm">${esc(s.n)} <small>${esc(s.host ?? "")}</small></span><span class="bb"><i style="width:${(s.w / max * 100).toFixed(1)}%;background:${pcol(x)}"></i></span><b>${val(w, s)}</b></div>`).join("")}</details>`; }).join("") || `<p class="meta">nothing used</p>`;
  };
  const when = (t) => esc(new Date(t).toLocaleString("en-CA", {weekday: "short", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false}));
  const pace = (w) => (w.used / ((w.to - w.from) / 3600_000 / 168 * 100)).toFixed(1);
  const head = (w) => `<p class="meta qw"><span>${when(w.from)} – ${when(w.to)}</span>${w.used == null ? "" : `<span>${perDay(w) > 1 ? `${fmtQ(w.used * 7)} of a day` : `${fmtQ(w.used)} of limit`} · ${pace(w)}x</span>`}</p>`;
  const w = qTab === "24h" ? S.burn24 : b.weeks[qTab === "last" ? 0 : 1];
  const view = !w ? `<p class="meta">loading…</p>` : w.error ? `<p class="meta err">${esc(w.error)}</p>` : `${head(w)}${list(w, qTab)}`;
  // days: newest first, a stacked bar each (widths by weighted tokens, the busiest day full), its projects on tap
  const days = [...b.days].reverse(), max = Math.max(1, ...days.map((d) => d.w)), inBars = new Set();
  const rows = days.map((d) => {
    const k = `days/${d.from}`;
    const segs = group(d).map((x) => (inBars.add(x.others ? "" : x.p), x)).map((x) => `<i style="width:${(x.w / max * 100).toFixed(2)}%;background:${pcol(x)}" title="${esc(x.others ? `others (${x.others.length})` : x.p)}"></i>`).join("");
    const label = `${d.label} ${new Date(d.from).getDate()}${d.from === b.weeks[1].from ? " ↻" : ""}`;
    return `<details class="bp bd" data-k="${esc(k)}" ${qOpen.has(k) ? "open" : ""}><summary><span class="nm">${esc(label)}</span><span class="bb">${segs}</span><b>${d.used == null ? "" : fmtQ(d.used * 7)}</b></summary>${list(d, k)}</details>`;
  }).join("");
  const lg = [...cmap.keys()].filter((p) => inBars.has(p)), gray = [...inBars].some((p) => !cmap.has(p));
  const legend = `<div class="legend">${lg.map((p) => `<span><i style="background:${cmap.get(p)}"></i>${esc(p)}</span>`).join("")}${gray ? `<span><i style="background:var(--gray)"></i>others</span>` : ""}</div>`;
  return `${tabs}${view}<h3 class="qh">by day</h3>${legend}${rows}<p class="meta">A bar is the day's weighted tokens; the % what the usage log added that day, as a share of a day's even pace (the limit / 7, so 100% = on pace); tap a day for its projects. ↻ the weekly reset.</p>${down}`;
}
// a project's name as shown: a path's last part ("~/prj/bank" -> "bank"); /tmp dirs -> "tmp",
// anything in .dotfiles or .claude -> "dotfiles" or "claude", "~/" -> "home", a dated dir -> its parent
function pname(p) {
  if (/^(\/private)?\/tmp\//.test(p)) return "tmp";
  if (p.includes(".dotfiles")) return "dotfiles";
  if (p.includes(".claude")) return "claude";
  const parts = p.split("/").filter((x) => x && x !== "~");
  if (!parts.length) return "home";
  const last = /^\d/.test(parts.at(-1)) && parts.length > 1 ? parts.at(-2) : parts.at(-1);
  return last.replace(/^\./, "");
}
// projects with the same shown name become one row (e.g. "ccx" and "~/prj/ccx")
function merged(projects) {
  const by = new Map();
  for (const x of projects) {
    const n = pname(x.p), m = by.get(n);
    if (!m) { by.set(n, {...x, p: n}); continue; }
    for (const f of ["w", "q", "share"]) m[f] = (m[f] ?? 0) + (x[f] ?? 0);
    m.sessions = m.sessions.concat(x.sessions).sort((a, b) => b.w - a.w);
  }
  return [...by.values()];
}
const fmtQ = (q) => q == null ? "" : q < 0.05 ? "<0.1%" : `${q < 10 ? q.toFixed(1) : Math.round(q)}%`;
document.addEventListener("toggle", (e) => { const k = e.target.dataset?.k; if (k) e.target.open ? qOpen.add(k) : qOpen.delete(k); }, true);

// ---------- actions
async function toNadya(text) {
  const n = nadyaRow();
  if (!n) throw new Error("nadya isn't running");
  await post(`${CCX}/s/${n.pid}/type`, {text});
}
function context() {
  if (!cur || cur === "nadya") return "";
  if (cur === "blog") return "about the blog";
  if (cur === "plan") return "plan";
  if (cur === "projects") return "projects";
  if (cur === "quota") return "about the quota";
  const r = S.rows.find((x) => x.pid === cur);
  return r ? `about ${r.name} (${r.pid})` : "";
}
$("#say").onsubmit = async (e) => {
  e.preventDefault();
  const q = e.target.q.value.trim(); if (!q) return;
  const r = isPid(cur) ? S.rows.find((x) => x.pid === cur) : null;
  const c = context(), text = r || !c ? q : `[cc, ${c}] ${q}`, to = r ?? nadyaRow();
  if (!to) return alert("Not sent: nadya isn't running");
  const p = {id: ++pendId, pid: to.pid, text, at: Date.now()};
  pending.push(p); e.target.q.value = "";
  setTimeout(() => drawView(true), 121e3);
  if (!r && cur !== "nadya") { cur = "nadya"; open(); } else drawView(true);
  toBottom();
  try { await post(`${CCX}/s/${to.pid}/type`, {text}); }
  catch (err) { p.err = err.message; if (!e.target.q.value) e.target.q.value = q; drawView(true); }
};
document.addEventListener("click", async (e) => {
  const pd = e.target.closest(".m.fail[data-pend]"); if (pd) { pending = pending.filter((p) => p.id !== +pd.dataset.pend); drawView(true); return; }
  if (e.target.closest("#qbtn")) { cur = "quota"; push(); open(); loadBurn(); return; }
  const qt = e.target.closest("[data-qt]"); if (qt) { qTab = qt.dataset.qt; drawView(true); return; }
  if (e.target.closest("#add")) { cur = "new"; push(); open(); dirHints($("#new")); return; }
  if (e.target.closest("#back, #title")) { if (history.state?.cc) history.back(); else document.body.classList.remove("view"); return; }
  const row = e.target.closest(".it"); if (row) { cur = row.dataset.id; push(); if (cur === "blog") localStorage.cc_blog_seen = Date.now(); if (cur === "plan" || cur === "projects") loadTodo(); open(); if ((cur === "nadya" || cur.includes(".")) && matchMedia("(hover: hover) and (pointer: fine)").matches) $("#say").q.focus(); return; }
  const go = e.target.closest("[data-go]"); if (go) { e.preventDefault(); cur = go.dataset.go; push(isDoc(cur)); if (cur === "plan" || cur === "projects") loadTodo(); open(); return; }
  const b = e.target.closest(".opts button"); if (!b) return;
  const box = b.parentElement; [...box.children].forEach((x) => x.disabled = true);
  try {
    if (box.dataset.pick) await post(`${CCX}/s/${box.dataset.pick}/pick`, {i: +b.dataset.i, labels: JSON.parse(box.dataset.labels)});
    else if (box.dataset.ask) { await post(`${BLOG}answer`, {id: box.dataset.ask, answer: b.textContent}); sent.set(box.dataset.ask, `answered: ${b.textContent}`); }
    else if (box.dataset.todo) { setTimeout(loadTodo, 60e3); await toNadya(`[cc, todo] ${b.textContent === "done" ? "mark done" : "snooze 1 h"}: ${box.dataset.todo.slice(0, 200)}`); sent.set("todo:" + box.dataset.todo, b.textContent === "done" ? "sent to nadya: done" : "sent to nadya: snooze 1 h"); }
    box.outerHTML = box.dataset.pick ? `<p class="done">✓ ${esc(b.textContent)}</p>` : "";
    draw(); drawView(true);
  } catch (err) { box.insertAdjacentHTML("afterend", `<p class="err">${esc(err.message)}</p>`); [...box.children].forEach((x) => x.disabled = false); }
});
// phone: opening an item is a history entry, so the browser's back (and the swipe) returns to the list
const narrow = () => matchMedia("(max-width: 760px)").matches;
function push(deeper) {
  if (!narrow()) return;
  if (history.state?.cc && !deeper) history.replaceState({cc: cur}, "");
  else history.pushState({cc: cur}, "");
}
addEventListener("popstate", (e) => {
  if (e.state?.cc) { cur = e.state.cc; open(); }
  else document.body.classList.remove("view");
});
function open() {
  document.body.classList.add("view");
  setHash();
  const pid = cur === "nadya" || cur === null ? nadyaRow()?.pid : isPid(cur) ? cur : null;
  follow(pid);
  draw(); drawView();
}

// ---------- start
listen();
loadUsage(); loadAsks(); loadBlog(); loadTodo();
setInterval(loadUsage, 5 * 60e3); setInterval(loadAsks, 60e3); setInterval(loadBlog, 60e3); setInterval(loadTodo, 30e3);
// back on the tab (or the phone woke up): read everything again at once
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { loadUsage(); loadAsks(); loadBlog(); loadTodo(); } });
setInterval(draw, 30e3);  // ages
const wait = setInterval(() => { if (!S.rows.length) return; clearInterval(wait); if (cur) open(); }, 200);
</script>
