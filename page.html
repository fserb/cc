<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#181020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ccx</title>
<style>
@font-face { font-family: Inconsolata; src: url(inconsolata.ttf) format("truetype"); font-weight: 200 900; font-stretch: 50% 200%; }
:root {
  --safe: env(safe-area-inset-bottom);
  --accent: #ceaadf; --mauve: #b8a0be; --dim: #626262; --text: #d6d6dc;
  --bg: #000; --bar: #181020; --panel: #0e0b12; --edge: #35284a; --cursor: #2a1e38;
  --gold: #ffd500; --idle: #82828a; --hint: #4a4a55; --error: #df6565;
  --busy: #93aeaa; --hold: #8a7f9c;
  --mono: Inconsolata, ui-monospace, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--panel); color: var(--text); }
body { font: 17px/1.4 var(--mono); -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: var(--accent); }

/* dvh follows the keyboard only because the viewport meta says
   interactive-widget=resizes-content: Chrome since 108, Firefox; not iOS Safari (2026-10) */
.app { height: var(--seen, 100dvh); display: flex; flex-direction: column; }
header {
  display: flex; align-items: center; gap: 4px; background: var(--bar);
  padding: calc(env(safe-area-inset-top) + 6px) 6px 6px; border-bottom: 1px solid var(--edge);
}
header .title[data-go] { cursor: pointer; line-height: 48px; }
header .title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header > .title:first-child { padding-left: 8px; }
header .title b { color: var(--accent); font-size: 20px; }
header .title small { margin-left: 8px; color: var(--idle); font-size: 15px; }
header .title .g { font-weight: bold; }
.icon { flex: none; width: 48px; height: 48px; border-radius: 10px; display: grid; place-items: center; font-size: 28px; color: var(--accent); }
.icon.sw { font: 600 19px var(--mono); }
.icon.sw.on { background: var(--cursor); }
.icon:active { background: var(--cursor); }
.counts { font-size: 19px; color: var(--idle); white-space: nowrap; }
.counts .off { color: var(--error); }
main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
/* a long press on something you tap selects nothing; the log and the pane stay selectable */
header, .rows, .group, .sugg, .opt, .icon { -webkit-user-select: none; user-select: none; }

.rows { list-style: none; }
.rows li a {
  display: grid; grid-template-columns: 22px 1fr auto; gap: 2px 8px; align-items: baseline;
  padding: 12px 14px; border-bottom: 1px solid #1a1422; color: inherit; text-decoration: none;
}
.rows li a:active { background: var(--cursor); }
.st { font: bold 16px var(--mono); white-space: nowrap; }
.nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.age { font-size: 14px; color: var(--dim); }
.sub { grid-column: 2 / 4; font-size: 15px; color: var(--idle); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub .p { color: var(--mauve); }
.sub .on { color: var(--hold); }
.rows li.notmux .nm::after { content: " no tmux"; font-size: 14px; color: var(--hint); }
.group { display: flex; align-items: center; gap: 10px; padding: 4px 6px 4px 14px; position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--edge); z-index: 1; }
.group .gp { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; color: var(--mauve); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.group .icon { width: 36px; height: 36px; font-size: 22px; }
.group .gc { font-size: 18px; color: var(--idle); white-space: nowrap; }
/* one empty row's worth under the last, so it does not end on the screen's edge */
main.list { padding-bottom: calc(60px + var(--safe)); }
.empty { padding: 40px 14px; color: var(--hint); text-align: center; }

.log, [data-events] { display: flex; flex-direction: column; gap: 12px; }
.log { padding: 10px 14px 20px; }
.more { align-self: center; font-size: 14px; color: var(--hint); padding: 4px 10px; }
.you { align-self: flex-end; max-width: 85%; background: var(--cursor); border: 1px solid var(--edge); padding: 9px 12px; border-radius: 14px 14px 4px 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.you .img { color: var(--hint); font-size: 14px; }
.peer { border-left: 2px solid var(--hold); padding: 4px 0 4px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.peer .from { display: block; font-size: 14px; color: var(--hold); margin-bottom: 2px; }
.cmd { font-size: 15px; color: var(--mauve); }
.out, .note { font-size: 14px; color: var(--dim); white-space: pre-wrap; overflow-wrap: anywhere; }
.note { color: var(--hint); text-align: center; }
.said { overflow-wrap: anywhere; }
.said > * + * { margin-top: 8px; }
.said code { font-size: 15px; color: var(--accent); }
.said pre { font: 15px/1.4 var(--mono); background: #07050a; border: 1px solid #1a1422; border-radius: 8px; padding: 8px 10px; overflow-x: auto; color: var(--text); }
.said pre code { color: var(--text); }
.said ul, .said ol { padding-left: 20px; }
.said h4 { color: var(--accent); font-size: 17px; }
details.tool { font: 15px/1.4 var(--mono); color: #46464e; }
details.tool summary { list-style: none; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
details.tool summary::-webkit-details-marker { display: none; }
/* ● and not ⏺: U+23FA is an emoji too, and Android draws it as an orange square that no
   color reaches */
details.tool summary::before { content: "● "; color: var(--busy); opacity: .5; }
details.tool.err summary::before { color: var(--error); }
details.tool summary b { color: #5c5c64; font-weight: 600; }
details.tool pre { margin: 6px 0 0 16px; padding-left: 8px; border-left: 1px solid var(--edge); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--dim); font: 14px/1.4 var(--mono); }
details.tool pre.in { color: var(--mauve); }
.working { font-size: 15px; color: var(--busy); }
.gone { font-size: 15px; color: var(--error); text-align: center; }

.screen { padding: 10px 8px; }
.screen pre { font: 14px/1.3 var(--mono); white-space: pre; overflow-x: auto; }

.compose { background: var(--bar); border-top: 1px solid var(--edge); padding: 8px 10px calc(var(--safe) + 8px); display: flex; flex-direction: column; gap: 8px; }
.kb .compose { padding-bottom: var(--safe); }
.dialog { display: flex; flex-direction: column; gap: 6px; padding: 10px; border: 1px solid #5a4a10; border-radius: 12px; background: #15110a; max-height: 55dvh; overflow-y: auto; }
.dq { font: 15px/1.4 var(--mono); display: flex; flex-direction: column; gap: 4px; margin-bottom: 4px; }
.dq .dt { color: var(--gold); font-weight: 600; }
.dq .db { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text); }
.opt { display: flex; gap: 10px; text-align: left; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--edge); background: #120d18; font: 16px/1.3 var(--mono); }
.opt b { color: var(--gold); flex: none; }
.opt small { display: block; color: var(--idle); font-size: 14px; white-space: pre-wrap; }
.opt.cur { border-color: #5a4a10; }
.opt:active, .opt.flash { background: var(--edge); }
.unparsed { font-size: 15px; color: var(--gold); }
.in { display: flex; gap: 8px; align-items: flex-end; }
.in .k { height: 40px; padding: 0 10px; border-radius: 12px; background: #120d18; border: 1px solid var(--edge); color: var(--mauve); font-size: 15px; }
.in .k:active { background: var(--edge); }
.in textarea { flex: 1; resize: none; min-height: 40px; max-height: 140px; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--edge); background: #07050a; color: var(--text); font: 17px/1.35 var(--mono); }
.in textarea::placeholder { color: var(--hint); }
.in .send { width: 44px; height: 40px; border-radius: 12px; background: var(--accent); color: #1a0f22; font-size: 20px; font-weight: 700; }
.readonly { padding: 12px 14px calc(var(--safe) + 12px); background: var(--bar); border-top: 1px solid var(--edge); font-size: 15px; color: var(--hint); text-align: center; }

.form { padding: 18px 14px; display: flex; flex-direction: column; gap: 14px; }
.form label { font-size: 14px; color: var(--idle); }
.form input[type=text] { width: 100%; margin-top: 6px; padding: 12px; border-radius: 10px; border: 1px solid var(--edge); background: #07050a; color: var(--text); font: 17px var(--mono); }
.sugg { list-style: none; border: 1px solid #1a1422; border-radius: 10px; overflow: hidden; }
.sugg:empty { display: none; }
.sugg li { padding: 11px 12px; font-size: 16px; border-bottom: 1px solid #1a1422; display: flex; justify-content: space-between; gap: 8px; cursor: pointer; }
.sugg li:last-child { border-bottom: 0; }
.sugg li:active { background: var(--cursor); }
.sugg li small { color: var(--dim); }
.sugg li b { color: var(--accent); font-weight: 400; }
.sugg h3 { font-size: 14px; font-weight: 400; color: var(--hint); padding: 8px 12px 4px; text-transform: uppercase; letter-spacing: .05em; }
.check { display: flex; gap: 10px; align-items: center; font-size: 16px; color: var(--gold); }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.foot { padding: 14px 14px calc(var(--safe) + 14px); border-top: 1px solid var(--edge); background: var(--bar); }
.big { width: 100%; padding: 13px; border-radius: 12px; border: 1px solid var(--edge); font-weight: 600; color: var(--accent); background: var(--cursor); }
.big:active { background: var(--edge); }
.big:disabled { color: var(--hint); }
.toast { position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); max-width: 90vw; background: var(--cursor); border: 1px solid var(--edge); color: var(--text); font-size: 15px; padding: 10px 14px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }
.toast.bad { border-color: var(--error); }
</style>
</head>
<body>
<script type="module">
// The ccx page: the listing, one session, and a form to start one. Everything comes from
// the API beside it; every URL is relative, since caddy serves this under /ccx/.

// the page is as tall as what is visible: with the keyboard up, Chrome on Android sometimes
// leaves 100dvh taller than that. And with the keyboard up the gesture bar inset can read 0
// while a strip still covers the bottom of the page, hiding the input. Half the inset seen
// before the keyboard opened, plus 4px, clears it and matches the 8px above the input,
// tuned by eye on an Android phone
const probe = document.createElement("div");
probe.style.cssText = "position: fixed; height: env(safe-area-inset-bottom); visibility: hidden";
document.documentElement.append(probe);
let inset = 0;
function fit() {
  const {height} = visualViewport;
  const root = document.documentElement;
  root.style.setProperty("--seen", `${height}px`);
  const kb = height < screen.height * 0.75;
  root.classList.toggle("kb", kb);
  if (!kb) {
    inset = probe.offsetHeight;
    root.style.removeProperty("--safe");
  } else {
    root.style.setProperty("--safe", `${inset / 2 + 4}px`);
  }
  scrollTo(0, 0);
}
visualViewport.addEventListener("resize", fit);
addEventListener("resize", fit);
fit();

const STATE = {
  wait: {glyph: "●", color: "#ffd500"},
  ask: {glyph: "◆", color: "#ffd500"},
  busy: {glyph: "◐", color: "#93aeaa"},
  hold: {glyph: "○", color: "#8a7f9c"},
  free: {glyph: "◌", color: "#626262"},
};
const ORDER = ["wait", "busy", "hold", "free"];

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) =>
  ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);
const stateOf = (r) => r.state === "wait" && r.asking ? STATE.ask : STATE[r.state] ?? STATE.free;
const glyph = (r) => {
  const {glyph, color} = stateOf(r);
  return `<span class="g" style="color:${color}">${glyph}</span>`;
};
const nameOf = (r) => r.name || String(r.pid);

function fmtAge(seconds) {
  const s = Math.max(0, Math.floor(seconds));
  if (s < 60) return `${s}s`;
  if (s < 3600) return `${Math.floor(s / 60)}m`;
  return `${Math.floor(s / 3600)}h`;
}
const ageOf = (r) => r.since ? fmtAge(Date.now() / 1000 - r.since) : "?";

async function api(path, body) {
  const init = body === undefined ? {} :
    {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify(body)};
  try {
    const r = await fetch(path, init);
    const data = await r.json();
    return r.ok ? data : {error: data.error ?? `HTTP ${r.status}`};
  } catch (e) {
    return {error: e.message};
  }
}

function toast(msg, bad = false) {
  const t = document.querySelector(".toast");
  t.textContent = msg;
  t.className = `toast on${bad ? " bad" : ""}`;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.className = "toast", bad ? 4000 : 1800);
}

const $ = (sel, root = document) => root.querySelector(sel);

function mount(html) {
  document.body.innerHTML = `${html}<div class="toast"></div>`;
}

// the list, shared by every view and kept current by one stream

let rows = [], offline = "", host = "";
let listStream = null;

function openList() {
  listStream?.close();
  listStream = new EventSource("api/events");
  listStream.addEventListener("list", (e) => {
    ({rows, offline, host} = JSON.parse(e.data));
    view?.onList?.();
  });
}

// One group per tmux session, which is one kitty window; instances outside tmux one group
// each. The title is the directory most of its rows share, ties to the first.
function groups() {
  const out = [];
  for (const r of rows) {
    const g = r.session ? out.find((g) => g.session === r.session) : null;
    if (g) g.rows.push(r);
    else out.push({session: r.session, rows: [r]});
  }
  for (const g of out) {
    const n = new Map();
    for (const r of g.rows) n.set(r.path, (n.get(r.path) ?? 0) + 1);
    g.path = [...n].reduce((a, b) => b[1] > a[1] ? b : a)[0];
    g.after = g.rows.findLast((r) => r.pane)?.pane ?? "";
  }
  return out;
}

function tally(list) {
  return ORDER.map((s) => {
    const n = list.filter((r) => r.state === s).length;
    return n ? `<span style="color:${STATE[s].color}">${STATE[s].glyph}${n}</span>` : "";
  }).filter(Boolean).join(" ");
}

let view = null;

// #

function listView() {
  const draw = () => {
    const row = (r, main) => {
      const on = r.waitsOn ? `<span class="on">on ${esc(r.waitsOn)}</span>` : "";
      const where = r.path === main ? "" : `<span class="p">${esc(r.path)}</span>`;
      // a /rename names the session and titles it too, so the summary would repeat the name
      const summary = r.summary === r.name ? "" : esc(r.summary);
      const sub = [where, on, summary].filter(Boolean).join(" · ");
      return `<li class="${r.hasPane ? "" : "notmux"}"><a href="#${r.pid}">
        <span class="st" style="color:${stateOf(r).color}">${stateOf(r).glyph}</span>
        <span class="nm">${esc(nameOf(r))}</span>
        <span class="age">${ageOf(r)}</span>
        <span class="sub">${sub}</span></a></li>`;
    };
    const body = groups().map((g) => `<section>
        <div class="group"><span class="gp">${esc(g.path)}</span><span class="gc">${tally(g.rows)}</span>
          <button class="icon" data-spawn="${esc(g.path)}" data-after="${esc(g.after)}" title="new claude in ${esc(g.path)}">+</button></div>
        <ul class="rows">${g.rows.map((r) => row(r, g.path)).join("")}</ul>
      </section>`).join("");
    const top = $("main")?.scrollTop ?? 0;
    mount(`<div class="app">
      <header>
        <div class="title"><b>ccx</b><small>${esc(host)}</small></div>
        <span class="counts">${tally(rows)}${offline ? ` <span class="off">${esc(offline)}</span>` : ""}</span>
        <button class="icon" data-go="#new" title="new claude in a directory">+</button>
      </header>
      <main class="list">${body || `<p class="empty">no claude running</p>`}</main>
    </div>`);
    $("main").scrollTop = top;
  };
  const timer = setInterval(draw, 10000);     // the ages move even when nothing else does
  draw();
  return {onList: draw, close: () => clearInterval(timer)};
}

// #<pid>

// A small markdown: fences, headings, lists, paragraphs, and inline code, bold and links.
// A table goes in as a fence, since its columns only line up in monospace.
function md(text) {
  const inline = (s) => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
  const out = [];
  const lines = text.split("\n");
  for (let i = 0; i < lines.length;) {
    const line = lines[i];
    if (line.startsWith("```")) {
      const code = [];
      for (i++; i < lines.length && !lines[i].startsWith("```"); i++) code.push(lines[i]);
      i++;
      out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`);
      continue;
    }
    if (/^\s*\|/.test(line)) {
      const table = [];
      for (; i < lines.length && /^\s*\|/.test(lines[i]); i++) table.push(lines[i]);
      out.push(`<pre>${esc(table.join("\n"))}</pre>`);
      continue;
    }
    const h = line.match(/^#{1,6}\s+(.*)/);
    if (h) {
      out.push(`<h4>${inline(h[1])}</h4>`);
      i++;
      continue;
    }
    const li = /^\s*([-*]|\d+\.)\s+/;
    if (li.test(line)) {
      const ordered = /^\s*\d+\./.test(line), items = [];
      for (; i < lines.length && (li.test(lines[i]) || /^\s{2,}\S/.test(lines[i])); i++) {
        if (li.test(lines[i])) items.push(lines[i].replace(li, ""));
        else items[items.length - 1] += ` ${lines[i].trim()}`;
      }
      const tag = ordered ? "ol" : "ul";
      out.push(`<${tag}>${items.map((t) => `<li>${inline(t)}</li>`).join("")}</${tag}>`);
      continue;
    }
    if (!line.trim()) {
      i++;
      continue;
    }
    const para = [];
    for (; i < lines.length && lines[i].trim() && !lines[i].startsWith("```") &&
      !li.test(lines[i]) && !/^#{1,6}\s/.test(lines[i]) && !/^\s*\|/.test(lines[i]); i++) {
      para.push(lines[i]);
    }
    out.push(`<p>${inline(para.join("\n")).replace(/\n/g, "<br>")}</p>`);
  }
  return out.join("");
}

function eventHtml(e) {
  switch (e.type) {
    case "user": return `<div class="you">${esc(e.text)}${e.images ? `<span class="img">${e.text ? "\n" : ""}[${e.images} image${e.images > 1 ? "s" : ""}]</span>` : ""}</div>`;
    case "peer": return `<div class="peer"><span class="from">from ${esc(e.from)}</span>${esc(e.text)}</div>`;
    case "text": return `<div class="said">${md(e.text)}</div>`;
    case "tool": return `<details class="tool" data-tool="${esc(e.id)}"><summary><b>${esc(e.name)}</b> ${esc(e.arg)}</summary><pre class="in">${esc(e.input)}</pre></details>`;
    case "command": return `<div class="cmd">${esc(e.text)}</div>`;
    case "output": return `<div class="out">${esc(e.text)}</div>`;
    case "note": return `<div class="note">${esc(e.text)}</div>`;
  }
  return "";
}

function sessionView(pid, tab) {
  const s = {pid, tab, events: [], start: 0, end: null, screen: "", dialog: null,
    gone: false, stream: null, row: rows.find((r) => r.pid === pid)};
  let drawn = false;

  const nearBottom = () => {
    const m = $("main");
    return !m || m.scrollHeight - m.scrollTop - m.clientHeight < 80;
  };
  const toBottom = () => {
    const m = $("main");
    if (m) m.scrollTop = m.scrollHeight;
  };
  // the log shrinking or growing under the keyboard, a dialog or the textarea keeps its
  // bottom edge where it was, so what was in view above the input stays in view
  let seen = 0;
  const keep = new ResizeObserver(([e]) => {
    const h = e.target.clientHeight;
    e.target.scrollTop += seen - h;
    seen = h;
  });

  // a result is drawn into its tool's <details>, which may be on an older page or not
  // arrived yet; one that has no tool here is left out
  const attach = (root, e) => {
    const d = root.querySelector(`[data-tool="${CSS.escape(e.id)}"]`);
    if (!d) return;
    if (e.error) d.classList.add("err");
    d.insertAdjacentHTML("beforeend", `<pre>${esc(e.text || (e.images ? `[${e.images} image]` : "(no output)"))}</pre>`);
  };
  const render = (events, root) => {
    for (const e of events) {
      if (e.type === "result") attach(root, e);
      else root.insertAdjacentHTML("beforeend", eventHtml(e));
    }
  };

  const header = () => {
    const r = s.row ?? {pid, name: "", path: "", state: "free"};
    const pane = r.hasPane;
    return `<button class="icon" data-go="#">‹</button>
      <div class="title" data-go="#">${glyph(r)} <b>${esc(nameOf(r))}</b><small>${esc(r.path)}</small></div>
      ${pane ? `<button class="icon sw${s.tab === "screen" ? " on" : ""}" data-tab title="${s.tab === "screen" ? "show the history" : "show the pane"}">${s.tab === "screen" ? "≡" : "&gt;_"}</button>
      <button class="icon" data-spawn="${esc(r.path)}" data-after="${esc(r.pane)}" title="new claude beside this one">+</button>` : ""}`;
  };

  const dialogHtml = () => {
    const r = s.row;
    if (!r?.hasPane || s.gone) return "";
    if (s.dialog) {
      const d = s.dialog;
      const box = (o) => o.checked === null ? "" : o.checked ? "[✔] " : "[ ] ";
      return `<div class="dialog">
        <div class="dq"><span class="dt">${esc(d.title)}</span>${d.body ? `<span class="db">${esc(d.body)}</span>` : ""}</div>
        ${d.options.map((o, i) => `<button class="opt${o.current ? " cur" : ""}" data-pick="${i}"><b>${o.n ?? "›"}</b><span>${box(o)}${esc(o.label)}${o.detail ? `<small>${esc(o.detail)}</small>` : ""}</span></button>`).join("")}
      </div>`;
    }
    if (r.asking) return `<div class="unparsed">a dialog is up (${esc(r.asking)}) that this page cannot read: the pane view shows it</div>`;
    return "";
  };

  const bottom = () => {
    if (s.gone) return `<div class="readonly">this claude has exited</div>`;
    if (!s.row) return "";                // not known yet: the first state event draws it
    if (!s.row.hasPane) return `<div class="readonly">not in tmux: history only</div>`;
    return `<div class="compose"><div data-dialog>${dialogHtml()}</div>
      <div class="in"><button class="k" data-esc>esc</button><textarea rows="1" placeholder="type into ${esc(nameOf(s.row))}…"></textarea><button class="send" data-send>↑</button></div>
    </div>`;
  };

  const body = () => s.tab === "screen"
    ? `<div class="screen"><pre>${esc(s.screen)}</pre></div>`
    : `<div class="log">${s.start > 0 ? `<button class="more" data-more>↑ earlier</button>` : ""}<div data-events></div>${s.gone ? `<div class="gone">exited</div>` : ""}<div class="working" ${s.row?.state === "busy" ? "" : "hidden"}>✻ working…</div></div>`;

  const draw = () => {
    const draft = $("textarea")?.value ?? "";
    mount(`<div class="app"><header>${header()}</header><main>${body()}</main>${bottom()}</div>`);
    if (s.tab !== "screen") render(s.events, $("[data-events]"));
    const ta = $("textarea");
    if (ta) ta.value = draft;
    keep.disconnect();
    seen = $("main").clientHeight;
    keep.observe($("main"));
    toBottom();
    drawn = true;
  };

  const append = (events) => {
    s.events.push(...events);
    if (!drawn || s.tab === "screen") return;
    const stick = nearBottom();
    render(events, $("[data-events]"));
    if (stick) toBottom();
  };

  const redrawDialog = () => {
    const box = $("[data-dialog]");
    if (box) box.innerHTML = dialogHtml();
  };

  const open = () => {
    s.stream?.close();
    s.stream = new EventSource(`api/s/${pid}/events${s.end === null ? "" : `?from=${s.end}`}`);
    s.stream.addEventListener("log", (e) => {
      const d = JSON.parse(e.data);
      if (d.reset) {
        Object.assign(s, {events: [], start: d.start ?? 0});
        append(d.events);
        s.end = d.end;
        draw();
        return;
      }
      s.end = d.end;
      if (d.events.length) append(d.events);
    });
    s.stream.addEventListener("state", (e) => {
      const was = s.row;
      const before = JSON.stringify([was?.state, was?.asking, was?.name, was?.hasPane]);
      s.row = JSON.parse(e.data);
      if (!was || was.hasPane !== s.row.hasPane) return draw();
      if (before === JSON.stringify([s.row.state, s.row.asking, s.row.name, s.row.hasPane])) return;
      $("header").innerHTML = header();
      const stick = nearBottom();
      const w = $(".working");
      if (w) w.hidden = s.row.state !== "busy";
      redrawDialog();
      if (stick) toBottom();
    });
    s.stream.addEventListener("screen", (e) => {
      s.screen = JSON.parse(e.data).text;
      if (s.tab !== "screen") return;
      const pre = $(".screen pre");
      if (!pre) return;
      const stick = nearBottom();
      pre.textContent = s.screen;
      if (stick) toBottom();
    });
    s.stream.addEventListener("dialog", (e) => {
      s.dialog = JSON.parse(e.data);
      const stick = nearBottom();
      redrawDialog();
      if (stick) toBottom();
    });
    s.stream.addEventListener("gone", () => {
      s.gone = true;
      s.stream.close();
      draw();
    });
  };

  const older = async () => {
    const p = await api(`api/s/${pid}/log?before=${s.start}`);
    if (p.error) return toast(p.error, true);
    const from = $("main").scrollHeight - $("main").scrollTop;
    s.events.unshift(...p.events);
    s.start = p.start;
    draw();
    $("main").scrollTop = $("main").scrollHeight - from;    // the same message stays in view
  };

  (async () => {
    // a claude started a moment ago can be ahead of the server's 1.5s poll, which answers
    // 404 until it catches up; that is not an exit
    let p = await api(`api/s/${pid}/log`);
    for (let n = 0; p.error && n < 8; n++) {
      await new Promise((ok) => setTimeout(ok, 500));
      p = await api(`api/s/${pid}/log`);
    }
    if (p.error) {
      if (!s.row) s.gone = true;
      draw();
      return toast(p.error, true);
    }
    Object.assign(s, {events: p.events, start: p.start, end: p.end});
    draw();
    open();
  })();
  mount(`<div class="app"><header>${header()}</header><main></main></div>`);

  return {
    s, older, open, draw,
    onList() {
      const r = rows.find((r) => r.pid === pid);
      if (r && !s.row) {
        s.row = r;
        draw();
      }
    },
    close: () => { s.stream?.close(); keep.disconnect(); },
  };
}

// #new

function newView() {
  let typed = localStorage.getItem("ccx.dir") ?? "~/";
  let known = {dirs: [], exists: false};
  let seq = 0;

  const draw = () => {
    mount(`<div class="app">
      <header><button class="icon" data-go="#">‹</button>
        <div class="title"><b>new claude</b><small>in a new kitty window</small></div></header>
      <main><div class="form">
        <label>directory<input type="text" value="${esc(typed)}" autocapitalize="off" autocorrect="off" spellcheck="false" data-dir-input></label>
        <ul class="sugg"></ul>
        <label class="check" hidden><input type="checkbox" data-mkdir> <span></span></label>
      </div></main>
      <div class="foot"><button class="big" data-start>start claude</button></div>
    </div>`);
    suggest();
  };

  const suggest = () => {
    const hl = (d) => `<b>${esc(d.slice(0, typed.length))}</b>${esc(d.slice(typed.length))}`;
    const li = (d, note) => `<li data-dir="${esc(d)}"><span>${hl(d)}</span><small>${note}</small></li>`;
    const running = [...new Set(rows.map((r) => r.path).filter((p) => p && p.startsWith(typed)))];
    const under = known.dirs.filter((d) => !running.includes(d));
    $(".sugg").innerHTML =
      (running.length ? `<h3>running</h3>${running.map((d) => li(d, "claude here")).join("")}` : "") +
      (under.length ? `<h3>on disk</h3>${under.map((d) => li(d, "")).join("")}` : "");
    const create = !known.exists && !typed.endsWith("/") && typed.trim() !== "";
    const check = $(".check");
    check.hidden = !create;
    $("span", check).textContent = `create ${typed}`;
  };

  const lookup = async () => {
    const mine = ++seq;
    const r = await api(`api/dirs?prefix=${encodeURIComponent(typed)}`);
    if (mine !== seq || r.error) return;
    known = r;
    suggest();
  };

  const set = (value) => {
    typed = value;
    localStorage.setItem("ccx.dir", typed);
    lookup();
    suggest();
  };

  draw();
  lookup();
  return {
    onList: suggest,
    set,
    pick(dir) {
      set(dir.endsWith("/") ? dir : `${dir}/`);
      const input = $("[data-dir-input]");
      input.value = typed;
      input.focus();
    },
    start: () => startClaude({dir: typed.replace(/\/+$/, "") || "/",
      mkdir: $("[data-mkdir]").checked}, "in a new kitty window"),
  };
}

// #starting

// A spawn takes from half a second to several: a new kitty window, a shell, claude, and
// the server's poll finding it. So the page moves at once, and this one is replaced by the
// session's when it is known, `replace` so that back is the list and not this.
let starting = null;

function startClaude(body, where) {
  starting = {body, where, at: Date.now(), result: api("api/spawn", body)};
  location.hash = "#starting";
}

function startingView() {
  if (!starting) {
    location.replace("#");
    return null;
  }
  const job = starting;
  let timer = 0, err = "";
  const draw = () => {
    const secs = Math.floor((Date.now() - job.at) / 1000);
    mount(`<div class="app">
      <header><button class="icon" data-go="#">‹</button>
        <div class="title" data-go="#"><span class="g" style="color:${STATE.free.color}">◌</span> <b>starting claude</b><small>${esc(job.where)}</small></div></header>
      <main><div class="log">
        <div class="cmd">${esc(job.body.dir)}</div>
        ${err ? `<div class="gone">${esc(err)}</div>` : `<div class="working">✻ starting… ${secs}s</div>`}
      </div></main>
    </div>`);
  };
  draw();
  timer = setInterval(draw, 1000);
  job.result.then((r) => {
    if (view?.job !== job) return;          // left the page before it settled
    if (r.pid) return location.replace(`#${r.pid}`);
    clearInterval(timer);
    err = r.error ?? "claude did not start";
    draw();
  });
  return {job, close: () => clearInterval(timer)};
}

// routing

function route() {
  view?.close?.();
  const [key, tab] = location.hash.slice(1).split("/");
  if (!key) view = listView();
  else if (key === "new") view = newView();
  else if (key === "starting") view = startingView();
  else view = sessionView(Number(key), tab === "screen" ? "screen" : "log");
}

function spawnBeside(button) {
  const {spawn: dir, after} = button.dataset;
  startClaude(after ? {dir, after} : {dir}, after ? "in a new tab beside" : "in a new kitty window");
}

async function send() {
  const ta = $("textarea"), text = ta.value;
  if (!text.trim()) return;
  ta.disabled = true;
  const r = await api(`api/s/${view.s.pid}/type`, {text});
  ta.disabled = false;
  if (r.error) return toast(r.error, true);
  ta.value = "";
  ta.style.height = "";
}

async function pick(button) {
  const {dialog, pid} = view.s;
  if (!dialog) return;
  button.classList.add("flash");
  const r = await api(`api/s/${pid}/pick`, {i: Number(button.dataset.pick),
    labels: dialog.options.map((o) => o.label)});
  if (r.error) {
    button.classList.remove("flash");
    toast(r.error, true);
  }
}

document.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-go],[data-spawn],[data-tab],[data-more],[data-esc],[data-send],[data-pick],[data-dir],[data-start]");
  if (!t) return;
  const d = t.dataset;
  if (d.go !== undefined) location.hash = d.go;
  else if (d.spawn !== undefined) spawnBeside(t);
  else if (d.tab !== undefined) {
    view.s.tab = view.s.tab === "screen" ? "log" : "screen";
    history.replaceState(null, "", `#${view.s.pid}${view.s.tab === "screen" ? "/screen" : ""}`);
    view.draw();
  } else if (d.more !== undefined) view.older();
  else if (d.esc !== undefined) {
    const r = await api(`api/s/${view.s.pid}/esc`, {});
    toast(r.error ?? "esc", Boolean(r.error));
  } else if (d.send !== undefined) send();
  else if (d.pick !== undefined) pick(t);
  else if (d.dir !== undefined) view.pick(d.dir);
  else if (d.start !== undefined) view.start();
});

document.addEventListener("input", (e) => {
  if (e.target.matches("[data-dir-input]")) view.set(e.target.value);
  if (e.target.matches("textarea")) {
    e.target.style.height = "auto";
    e.target.style.height = `${e.target.scrollHeight}px`;
  }
});

document.addEventListener("keydown", (e) => {
  // enter sends on a keyboard with a shift key; a phone's return is a newline
  if (e.target.matches("textarea") && e.key === "Enter" && !e.shiftKey && matchMedia("(pointer: fine)").matches) {
    e.preventDefault();
    send();
  }
});

// iOS drops an EventSource when the page goes to the background, and does not always say
// so; coming back reopens both, from where they were
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  openList();
  if (view?.s && !view.s.gone && view.s.end !== null) view.open();
});

addEventListener("hashchange", route);
openList();
route();
</script>
</body>
</html>
