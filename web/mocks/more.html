<title>cc mocks: where the less used things go</title>
<style>

  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f1f3f5; color: var(--text); font: 15px/1.5 var(--font); padding: 1.5rem; }
  body > nav { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.5rem; }

  .app > header b { font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .app > header .q { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .app > header .q i { display: inline-block; width: 70px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--green) 41%, var(--line) 41%); }
  .app > header .q b { color: var(--text); font-size: 1rem; }

  .sec.tog { cursor: pointer; } .sec.tog:hover { color: var(--text); }
  .sec .n { margin-left: auto; text-transform: none; letter-spacing: 0; }
  .it { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 0 0.7rem; padding: 0.35rem 1.1rem; cursor: pointer; align-items: baseline; }
  .it:hover { background: var(--hover); }

  .it .d { width: 8px; height: 8px; border-radius: 50%; position: relative; top: calc(4px - 0.5ex); }

  .it .tx div .at { margin-left: auto; font: 0.66rem var(--mono); color: var(--muted); }
  .it .tx small { display: block; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.8rem; }

  .phone .it { padding: 9px 14px; min-height: 44px; } .phone .it .tx div { font-size: 16px; }

  .mini { all: unset; cursor: pointer; font-size: 0.78rem; color: var(--accent); padding: 0.1rem 0.5rem; border: 1px solid currentColor; border-radius: 999px; white-space: nowrap; }
  .mini:hover { background: var(--accent); color: var(--on-accent); }

  .phone article { padding: 1rem; }

  .rows li time { font-size: 0.75rem; color: var(--muted); }
  .rows.tight li { padding: 0.3rem 0; }
  .rows.tight li small { font-size: 0.76rem; }
  .rows input { font: inherit; font-size: 0.82rem; border: 1px solid var(--line); border-radius: 6px; padding: 0.15rem 0.4rem; width: 9rem; }

  .dock { position: sticky; bottom: 0; margin-top: auto; background: var(--bg); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); }
  .dock button { all: unset; cursor: pointer; display: grid; justify-items: center; gap: 0.1rem; padding: 0.5rem 0 0.45rem; color: var(--muted); font-size: 0.7rem; position: relative; }

  /* C / F / H: one button at the bottom */
  .foot { position: sticky; bottom: 0; margin-top: auto; background: var(--bg); padding: 0.6rem 1.1rem; display: flex; gap: 0.5rem; }
  .foot > button { all: unset; cursor: pointer; flex: 1; text-align: center; border: 1px dashed var(--gray); border-radius: 8px; padding: 0.35rem 0; color: var(--muted); }

  .seg { position: sticky; bottom: 0; margin-top: auto; background: var(--bg); border-top: 1px solid var(--line); padding: 0.5rem 1.1rem; }

  .palres { position: absolute; left: 0.8rem; right: 0.8rem; top: calc(100% - 0.1rem); background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px #0002; max-height: 440px; overflow: auto; padding: 0.3rem 0; }

  .palres .pr { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 0.5rem; padding: 0.3rem 0.8rem; cursor: pointer; align-items: baseline; font-size: 0.88rem; }
  .palres .pr:hover, .palres .pr.sel { background: var(--cur); }
  .palres .pr span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .palres .pr small { color: var(--muted); font-size: 0.75rem; white-space: nowrap; }
  .palres .pr i { font-style: normal; color: var(--muted); }
  .kbd { font: 0.7rem var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 0.3rem; }

  /* E: header menu / F: sheet / G: side panel */

  .pop.menu h4 a, .sheet h4 a, .side h4 a { margin-left: auto; text-transform: none; letter-spacing: 0; color: var(--accent); cursor: pointer; }
  .mi { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 0.6rem; padding: 0.3rem 1rem; align-items: center; cursor: pointer; font-size: 0.9rem; }

  .desk .sheet { left: 0.5rem; right: auto; width: 360px; bottom: 3.2rem; border-radius: 12px; border: 1px solid var(--line); }

  .pop.ipop { width: 360px; max-height: 500px; padding: 0.3rem 0 0.7rem; }

</style>

  {id: "nadya-d", at: "nadya", goal: "extract cap", t: "yesterday"},
  {id: "tracker-b", at: "web/tracker", goal: "Canada Post scraping", t: "Oct 15"},
  {id: "blog-a", at: "web/blog", goal: "image galleries", t: "Oct 14"},
];
const TASKS = [
  {id: "dream", what: "an hour of ideas, writes to dream/", last: "02:45"},
  {id: "nightly", what: "day digest and profile proposals", last: "02:41"},
  {id: "daily", what: "the morning check", last: "08:07"},
  {id: "backup", what: "snapshot nadya to lenin", last: "03:10"},
  {id: "track", what: "track a package", ask: "tracking number"},
  {id: "research", what: "research a question, an HTML report", ask: "question"},
  {id: "mocks", what: "mocks for an idea", ask: "idea"},
  {id: "publish", what: "publish the blog inbox", last: "Oct 16"},
  {id: "status", what: "what every host and session is doing", last: "Oct 15"},
];
const FILES = [
  {n: "ideas/", k: "dir", c: 41, t: "1h"}, {n: "projects/", k: "dir", c: 23, t: "3h"}, {n: "research/", k: "dir", c: 17, t: "3h"},
  {n: "todo/", k: "dir", c: 6, t: "today"}, {n: "days/", k: "dir", c: 8, t: "02:58"}, {n: "dream/", k: "dir", c: 4, t: "07:41"},
  {n: "user/", k: "dir", c: 3, t: "Oct 15"}, {n: "CLAUDE.md", t: "2h"}, {n: "nadya-log.md", t: "4 min"}, {n: "projects.md", t: "Oct 16"},
];
const RECENT2 = [["projects/cc.md", "12 min"], ["nadya-log.md", "14 min"], ["todo/todo.md", "1h"], ["research/password-sync.md", "3h"], ["ideas/yt-witch.md", "5h"], ["days/2026-10-16.md", "02:58"], ["dream/2026-10-17/README.md", "07:41"], ["user/prefs.md", "Oct 15"]];
const RECENT = ["projects/cc.md", "todo/todo.md", "research/password-sync.md", "ideas/yt-witch.md", "days/2026-10-16.md"];
const DIRS = ["ai/cc", "web/tracker", "marx:web/arcade", "marx:web/soccer", "nadya", "web/blog", "ai/trig"];

// ---------- the pieces every option shares
function row(i, st) {
  const d = i.d === "q" ? `<span class="d q">?</span>` : i.ic ? `<span class="d ic">${I[i.ic]}</span>` : `<span class="d ${i.d}"></span>`;
  return `<div class="it ${i.bold ? "bold" : ""}" data-act="open:${i.id}" aria-current="${st.cur === i.id}">${d}<span class="tx"><div><span>${esc(i.title)}</span>${i.tag ? `<span class="tag">${i.tag}</span>` : ""}${i.at ? `<span class="at">${esc(i.at)}</span>` : ""}</div>${i.sub ? `<small>${esc(i.sub)}</small>` : ""}</span>${i.at ? "" : `<time>${esc(i.t ?? "")}</time>`}</div>`;
}
function list(st) {
  const temp = [...st.running.map((t) => ({id: `run-${t}`, d: "yel", title: t, sub: "running, started just now", t: "now", bold: true})), ...TEMP];
  return FIXED.map((i) => row(i, st)).join("") + `<div class="sec">now</div>` + temp.map((i) => row(i, st)).join("") +
    `<div class="sec">sessions</div>` + [...SESS, ...st.back.map((b) => ({id: b.id, d: "red", title: b.id, at: b.at, sub: b.goal})), ...st.spawned].map((i) => row(i, st)).join("");
}
function closedList(st, n, tight) {
  const cs = CLOSED.filter((c) => !st.back.some((b) => b.id === c.id)).slice(0, n);
  return `<ul class="rows ${tight ? "tight" : ""}">${cs.map((c) => `<li data-act="bring:${c.id}" title="restore" style="cursor:pointer"><span class="nm"><b>${c.id}</b><code>${c.at}</code></span><small>${esc(c.goal)}</small><span class="r"><time>${c.t}</time></span></li>`).join("")}</ul>`;
}
function taskList(st, n, tight) {
  return `<ul class="rows ${tight ? "tight" : ""}">${TASKS.slice(0, n).map((t) => {
    const on = st.running.includes(t.id);
    return `<li><span class="nm"><b>${t.id}</b></span><small>${esc(t.what)}${t.last ? ` · last ${t.last}` : ""}</small><span class="r">${t.ask && !tight ? `<input placeholder="${t.ask}">` : ""}<button class="mini ${on ? "on" : ""}" data-act="run:${t.id}">${on ? "running" : "run"}</button></span></li>`;
  }).join("")}</ul>`;
}
function taskChips(st) {
  return `<div class="tchips">${TASKS.map((t) => `<button class="${st.running.includes(t.id) ? "on" : ""}" data-act="run:${t.id}" title="${esc(t.what)}">${st.running.includes(t.id) ? "● " : "▸ "}${t.id}${t.ask ? "…" : ""}</button>`).join("")}</div>`;
}
function filesList(n, tight) {
  return `<ul class="rows fl ${tight ? "tight" : ""}">${FILES.slice(0, n).map((f) => `<li data-act="open:files"><span class="ico">${f.k ? "▸" : "·"}</span><span class="nm"><b style="font-weight:${f.k ? 600 : 400}">${f.n}</b>${f.c ? `<code>${f.c}</code>` : ""}</span><time>${f.t}</time></li>`).join("")}</ul>`;
}
function newForm(st, compact) {
  if (st.made) return `<p class="ok">started ${esc(st.made)}, it is in sessions</p>`;
  return `<form class="new" data-form="new"><label>where<input type="text" name="dir" placeholder="host:dir" value="${esc(st.dir ?? "")}"></label><div class="chips">${DIRS.map((d) => `<button type="button" data-act="dir:${d}">${d}</button>`).join("")}</div>${compact ? "" : `<label>goal<input type="text" name="goal" placeholder="a few words on what it is for"></label><div class="row"><label class="check"><input type="checkbox"> focus in kitty</label></div>`}<div><button class="go">start</button></div></form>`;
}
const VIEW = {
  files: () => `<article><h1>files</h1><input class="search" placeholder="search ~/nadya"><h3>recent</h3><ul class="rows fl">${RECENT.map((f) => `<li><span class="ico">·</span><span class="nm">${f}</span><time></time></li>`).join("")}</ul><h3>~/nadya</h3>${filesList(99)}</article>`,
  closed: (st) => `<article><h1>closed sessions</h1>${closedList(st, 99)}</article>`,
  new: (st) => `<article><h1>new session</h1>${newForm(st)}</article>`,
  tasks: (st) => `<article><h1>tasks</h1>${taskList(st, 99)}</article>`,
  more: (st) => `<div class="grid4"><div><h3>new session</h3>${newForm(st, true)}</div><div><h3>tasks</h3>${taskChips(st)}</div><div><h3>closed</h3>${closedList(st, 5, true)}</div><div><h3>files</h3><input class="search" placeholder="search ~/nadya" style="margin-bottom:.4rem">${filesList(7, true)}</div></div>`,
};
function center(st) {
  const c = st.cur;
  if (!c) return `<div class="chat"><p style="color:var(--muted)">nothing open</p></div>`;
  if (VIEW[c]) return VIEW[c](st);
  if (c.startsWith("f:")) return `<article><p style="font:0.8rem var(--mono);color:var(--muted);margin:0 0 .4rem">~/nadya/${esc(c.slice(2))}</p><h1>${esc(c.slice(2).split("/").pop())}</h1><p style="color:var(--muted)">the file, as the files page shows it</p></article>`;
  const all = [...FIXED, ...TEMP, ...SESS];
  const it = all.find((i) => i.id === c) ?? {title: c.replace(/^run-/, ""), sub: ""};
  if (FIXED.includes(it) && it.id === "blog" || TEMP.includes(it)) return `<article><h1>${esc(it.title)}</h1><p style="color:var(--muted)">${esc(it.sub)}</p></article>`;
  return `<div class="chat"><p class="me">how is it going?</p><p>${esc(it.sub || "started")}: working on it, two of five done.</p><div class="say">message ${esc(it.title)}</div></div>`;
}
const title = (st) => st.cur?.startsWith("f:") ? st.cur.slice(2).split("/").pop() : st.cur ? ({files: "files", closed: "closed sessions", new: "new session", tasks: "tasks", more: "more"})[st.cur] ?? st.cur.replace(/^run-/, "") : "nadya";
const quota = `<span class="q"><i></i><b>41%</b>1.1x</span>`;

// ---------- the options
const OPTS = [
  {k: "K", name: "icons", note: "desktop: the header in three, the icons over the list (closed on its right end), the title over the page, the quota; phone: on top of the list, spread across. Each opens a pop-up",
    hdr: (st) => `<header class="three"><span class="hl">${icons(st, KINDS.filter(([v]) => v !== "closed"))}<span class="sp"></span>${icons(st, KINDS.filter(([v]) => v === "closed"))}</span><b>${esc(title(st))}</b>${quota}</header>`,
    left: (st) => st.phone ? `<div class="irow spread">${icons(st)}</div>` + list(st) : list(st),
    pop: (st) => ipop(st, st.phone ? 84 : 44)},
];

const KINDS = [["new", "new session"], ["tasks", "tasks"], ["closed", "restore session"], ["files", "files"]];
function icons(st, kinds = KINDS) {
  const n = CLOSED.length - st.back.length;
  return kinds.map(([v, l]) => `<button class="hb" data-act="ip:${v}" aria-pressed="${st.ip === v}" title="${l}">${I[v]}${v === "closed" ? `<em>${n}</em>` : ""}</button>`).join("");
}
function ipop(st, top) {
  if (!st.ip) return "";
  const at = KINDS.findIndex(([v]) => v === st.ip), l = KINDS[at][1];
  const body = {
    new: () => `<h4>${l}</h4><div class="pad">${newForm(st)}</div>`,
    tasks: () => `<h4>tasks</h4><div class="pad"><ul class="rows tight">${TASKS.slice(0, 7).map((t) => { const on = st.running.includes(t.id); return `<li data-act="${t.ask ? "open:tasks" : `run:${t.id}`}" style="cursor:pointer"><span class="nm"><span>${t.id}${t.ask ? "…" : ""}</span></span><span class="r"><time>${on ? "running" : t.last ?? ""}</time></span></li>`; }).join("")}</ul><button class="go" data-act="open:tasks" style="display:table;margin:.7rem 0 0 auto">${I.tasks.replace("<svg", '<svg style="width:15px;height:15px;vertical-align:-2px;margin-right:.4rem"')}all tasks</button></div>`,
    closed: () => `<h4>${l}</h4><div class="pad">${closedList(st, 99, true)}</div>`,
    files: () => `<h4>recent files</h4><div class="pad"><ul class="rows tight">${RECENT2.map(([f, t]) => `<li data-act="open:f:${f}" style="cursor:pointer"><span class="nm"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f}</span></span><span class="r"><time>${t}</time></span></li>`).join("")}</ul><button class="go" data-act="open:files" style="display:table;margin:.7rem 0 0 auto">${I.files.replace("<svg", '<svg style="width:15px;height:15px;vertical-align:-2px;margin-right:.4rem"')}all files</button></div>`,
  }[st.ip]();
  return `<div class="shade ${st.phone ? "dim" : ""}" data-act="ip:"></div><div class="pop ipop" style="top:${top - 46 + 4}px;left:${12 + at * 32}px">${body}</div>`;
}

// ---------- frames
const frames = [];
function frame(o, phone) {
  const st = {o, phone, cur: phone ? null : "cc-a", running: [], back: [], spawned: []};
  const el = document.createElement("div");
  el.className = `app ${phone ? "phone" : "desk"} ${o.k.toLowerCase()}`;
  frames.push({el, st});
  draw(el, st);
  el.addEventListener("click", (e) => act(e, el, st));
  el.addEventListener("submit", (e) => {
    e.preventDefault();
    const dir = e.target.dir?.value.trim();
    if (dir) { spawn(st, dir); if (st.ip) { st.ip = ""; st.cur = st.spawned.at(-1).id; } }
    draw(el, st);
  });
  return el;
}
function spawn(st, dir) {
  const name = `${dir.split(/[/:]/).pop()}-${"abcdefgh"[st.spawned.length + 1]}`;
  st.spawned.push({id: name, d: "gray", title: name, at: dir, sub: " "});
  st.made = name; st.dir = "";
  setTimeout(() => { st.made = null; }, 2500);
}
function act(e, el, st) {
  const a = e.target.closest("[data-act]")?.dataset.act;
  if (!a) {
    if (st.palOpen && !e.target.closest(".pal")) { st.palOpen = false; draw(el, st); }
    return;
  }
  const [k, v] = [a.slice(0, a.indexOf(":") < 0 ? a.length : a.indexOf(":")), a.includes(":") ? a.slice(a.indexOf(":") + 1) : ""];
  const close = () => { st.ip = ""; st.menu = false; st.sheet = false; st.palOpen = false; st.q = ""; };
  if (k === "open") { close(); st.cur = v; if (["new", "tasks", "closed", "files"].includes(v)) st.page = st.page; }
  if (k === "back") st.cur = null;
  if (k === "menu") st.menu = !st.menu;
  if (k === "sheet") st.sheet = !st.sheet;
  if (k === "fold") st.fold = !st.fold;
  if (k === "page") st.page = v === "1";
  if (k === "ip") st.ip = st.ip === v ? "" : v;
  if (k === "side") st.side = st.side === v ? "" : v;
  if (k === "dir") { st.dir = v; }
  if (k === "spawn") { close(); spawn(st, v); st.cur = st.spawned.at(-1).id; }
  if (k === "run" && !st.running.includes(v)) { st.running.unshift(v); if (st.palOpen || st.menu || st.ip) { close(); st.cur = `run-${v}`; } }
  if (k === "bring") { const c = CLOSED.find((c) => c.id === v); if (!st.back.includes(c)) st.back.push(c); if (st.palOpen || st.menu || st.ip) { close(); st.cur = v; } }
  draw(el, st);
}
function draw(el, st, keepPal) {
  const {o, phone} = st;
  const open = phone && st.cur && !(o.k === "G" && st.side);
  el.classList.toggle("open", !!open);
  const t = phone && open ? `<button class="back" data-act="back">‹</button><b>${esc(title(st))}</b>` : `<b>${phone ? "nadya" : esc(title(st))}</b>`;
  el.innerHTML = `${o.hdr && !phone ? o.hdr(st) : `<header>${o.head?.(st) ?? ""}${t}${quota}</header>`}<div class="home"><nav class="left">${(o.left ?? list)(st)}</nav><div class="center">${center(st)}</div>${o.rail?.(st) ?? ""}${o.pop?.(st) ?? ""}</div>`;
  const pb = st.ip && el.querySelector(`[data-act="ip:${st.ip}"]`), pp = el.querySelector(".ipop");
  if (pb && pp && !phone) pp.style.left = `${Math.min(pb.getBoundingClientRect().left - el.getBoundingClientRect().left - 8, el.clientWidth - pp.offsetWidth - 8)}px`;
  if (keepPal) { const i = el.querySelector("[data-pal]"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
}

const nav = document.getElementById("nav"), main = document.getElementById("opts");
for (const o of OPTS) {
  const s = document.createElement("section");
  s.className = "opt"; s.id = o.k;
  s.innerHTML = `<h2>${o.k}. ${o.name}<small>${o.note}</small></h2><div class="pair"></div>`;
  s.querySelector(".pair").append(frame(o, false), frame(o, true));
  main.append(s);
}
</script>
</body>
</html>
