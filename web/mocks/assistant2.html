// where each kind of event is kept, for the detail box
const WHERE = {
  you: "nadya's transcript: a user line, origin.kind \"human\". cc's nadya chat shows it today.",
  reply: "nadya's transcript: an assistant text block (or a thinking block drawn as a reply).",
  spawn: "nadya's Bash tool call (ccx new, ccx user). cchost: a new api/list row with name, pid, dir, goal; api/changes \"new\".",
  msg: "the sender's transcript: a SendMessage tool call; the receiver's: a user line with origin.kind \"peer\" and origin.name.",
  done: "the helper's SendMessage; nadya's transcript: a user line, origin.kind \"peer\", origin.name the helper, body starting \"<name> done:\".",
  tools: "the helper's transcript: assistant lines with tool_use blocks. cchost: state busy.",
  trig: "nadya's transcript: a peer line from trig, made from cchost's api/changes.",
  commit: "git log in the project's repo.",
  blog: "~/web/blog/index.html: an <article data-project=...> with time, project, helper name.",
  close: "nadya's Bash (ccx close). cchost: the row goes, api/changes \"gone\". A line in nadya-log.md.",
  direct: "the helper's transcript only: user lines, origin.kind \"human\". Not in nadya's transcript.",
  ask: "cchost: the record says waiting, waitingFor \"input needed\"; the dialog text is on the pane only (the askhook file on hosts that have it).",
  answer: "the helper's pane (a key press); then the tool_result in the helper's transcript.",
  quiet: "nadya's transcript: an assistant text block that is only \"·\".",
  log: "nadya-log.md, one line per event, written by nadya.",

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);
const cut = (s, n = 90) => s.length > n ? `${s.slice(0, n - 1).trimEnd()}…` : s;
// a screen element that came from events `ids`; `as` names what it is on this screen
const m = (ids, as, html, tag = "div", cls = "") => `<${tag} class="m ${cls}" data-src="${[ids].flat().filter(Boolean).join(" ")}" data-as="${esc(as)}">${html}</${tag}>`;
const chip = (l) => `<span class="chip">${/^[0-9a-f]{7}$/.test(l) ? `⎇ ${l}` : esc(l)}</span>`;
const hours = (e) => e.tm ?? (+e.at.slice(0, 2) + +e.at.slice(3, 5) / 60);

for (const sc of Object.values(STORIES)) {
  sc.ix = Object.fromEntries(sc.ev.map((e, i) => [e.id, i]));
  sc.byId = Object.fromEntries(sc.ev.map((e) => [e.id, e]));
  sc.L = sc.lanes.map((l) => typeof l === "string" ? {k: l, ...LANE[l]} : l);
  sc.li = Object.fromEntries(sc.L.map((l, i) => [l.k, i]));
}

// what the world looks like after event `now`
function ctx(sc, now) {
  const seen = (id) => id != null && sc.ix[id] <= now;
  const E = (id) => sc.byId[id];
  const st = (s) => {
    if (!seen(s.start)) return null;
    if (seen(s.end)) return "gone";
    if (s.ask && seen(s.ask) && !seen(s.answer)) return "asking";
    if (s.direct && seen(s.direct) && !s.done.some(seen)) return "with you";
    if (s.done.some(seen)) {
      // done, unless nadya sent it more work since
      const lastDone = s.done.filter(seen).at(-1), after = sc.ev.slice(sc.ix[lastDone] + 1, now + 1);
      return after.some((e) => e.kind === "msg" && e.to === s.lane) ? "busy" : "wait";
    }
    return "busy";
  };
  const live = sc.sess.filter((s) => st(s) && st(s) !== "gone");
  const started = sc.sess.filter((s) => st(s));
  const jobSt = started.length === 0 ? "asked" : started.some((s) => st(s) === "asking") ? "q" : live.length ? "busy" : "done";
  const doneIds = (s) => s.done.filter(seen);
  return {seen, E, st, live, started, jobSt, doneIds, now, at: sc.ev[now].at};
}
const stDot = (st) => `<span class="sd ${(st ?? "").replace(" ", "")}"></span>`;
const stWord = (st) => ({busy: "working", wait: "done, not closed", asking: "asks you", "with you": "with you in its pane", gone: "closed"})[st] ?? st;

// ---------- 1. Jobs ----------
function jobs(sc, c) {
  const {seen, E, st} = c;
  const j = sc.job;
  const sessLine = (s) => {
    const x = st(s);
    if (!x) return "";
    const last = c.doneIds(s).at(-1);
    const what = last ? cut(E(last).t.replace(/^[\w-]+ done: /, ""), 70) : s.hello && seen(s.hello) ? cut(E(s.hello).t.replace(/^[\w-]+, [^:]+: /, ""), 70) : s.goal;
    return m([s.start, s.hello, s.work, seen(s.answer) && s.answer, ...c.doneIds(s), seen(s.end) && s.end], "the session's line on the job card",
      `${stDot(x)}<span><b>${esc(s.n)}</b> <span class="xs muted">${esc(s.pid)}${s.resumed ? " · resumed" : ""}${s.work && seen(s.work) ? " · " + m(s.work, "folded: a step count on the card", "79 steps", "span") : ""}</span> · ${stWord(x)}: ${esc(what)}</span>`, "div", "sl");
  };
  const qBlock = sc.q && seen(sc.q.ev) && !seen(sc.q.answer) ? m(sc.q.ev, "the question, on the job card; the card moves to needs you",
    `<div class="k" style="color:var(--q)">design-a-b asks you · ${E(sc.q.ev).at}</div><b>${esc(sc.q.t)}</b><div class="opts">${sc.q.opts.map((o) => `<button class="b">${o}</button>`).join("")}</div>`, "div", "card need") : "";
  const directs = sc.sess.filter((s) => s.direct && st(s) === "with you").map((s) => m(s.direct, "the card says 'with you' and opens the pane", `<div class="sm">you are working with ${esc(s.n)} in its pane <span class="chip">open pane</span></div>`)).join("");
  const follows = j.follow.filter(seen).map((id) => m(id, "a follow-up line on the same card", `<div class="sm" style="margin-top:.2rem">+ you, ${E(id).at}: ${esc(cut(E(id).t, 80))}</div>`)).join("");
  const results = sc.sess.filter((s) => c.doneIds(s).length && seen(s.end)).map((s) => m([s.done.at(-1), ...(s.commit ?? []).filter(seen), ...(s.blog ?? []).filter(seen)], "the result and its links on the card",
    `<div class="sm" style="margin-top:.25rem">✓ ${esc(s.res)}</div><div class="chips">${s.links.map(chip).join("")}</div>`)).join("");
  const card = c.started.length ? `<div class="card ${c.jobSt === "q" ? "need" : ""}">
    ${m([j.words, ...j.more.filter(seen)], "the card's title: your words", `<div class="k">${sc.proj} · ${E(j.words).at}${c.jobSt === "done" ? " → " + E(sc.sess.at(-1).end).at : ""}</div><h5>${esc(j.title)}</h5>`)}
    ${sc.sess.map(sessLine).join("")}${follows}${directs}${qBlock}${results}</div>` : "";
  const otherCards = Object.entries(sc.others).filter(([id, o]) => o.by && seen(id)).map(([id, o]) => m(id, "its own job card", `<div class="k">${o.room} · ${E(id).at}</div><h5>${esc(o.title)}</h5><div class="sl">${stDot("busy")}<b>${o.by}</b></div>`, "div", "card dim"));
  const lastReply = [...sc.replies, ...Object.values(sc.others).map((o) => o.reply).filter(Boolean)].filter(seen).sort((a, b) => sc.ix[a] - sc.ix[b]).at(-1);
  const lastYou = sc.ev.filter((e) => e.kind === "you" && seen(e.id)).at(-1);
  const under = lastReply && sc.ix[lastReply] > sc.ix[lastYou?.id ?? sc.ev[0].id] ? m(lastReply, "the line under the box, until the next one", `<b>nadya</b>: ${esc(cut(E(lastReply).t, 150))}`, "div", "sm")
    : lastYou ? m(lastYou.id, sc.others[lastYou.id] && !sc.others[lastYou.id].by ? "a short answer under the box, no card" : "the box, as sent", `<span class="muted">you, ${lastYou.at}:</span> ${esc(cut(lastYou.t, 110))}`, "div", "sm") : "";
  const col = (k) => k === c.jobSt || (k === "busy" && c.jobSt === "asked") ? card : "";
  return `<div class="top"><b>cc</b><span class="r">${c.at}</span></div>
    <div style="padding:.5rem .6rem"><div class="in"><span>a new job for nadya…</span><button class="b pri">ask</button></div><div style="margin:.35rem .2rem 0">${under}</div></div>
    <div class="cols"><div><div class="ch">needs you</div>${col("q")}</div><div><div class="ch">running</div>${col("busy")}${otherCards.join("")}</div><div><div class="ch">done today</div>${col("done")}</div></div>`;
}

// ---------- 2. One conversation ----------
function talk(sc, c) {
  const {seen, E, st} = c;
  const out = [];
  for (const e of sc.ev) {
    if (!seen(e.id)) break;
    if (e.kind === "you") out.push(m(e.id, "your bubble in the thread", `<div class="who me">you · ${e.at}</div><div class="bub me">${esc(cut(e.t, 160))}</div>`));
    if (e.kind === "reply") out.push(m(e.id, "nadya's bubble in the thread", `<div class="who">nadya · ${e.at}</div><div class="bub">${esc(cut(e.t, 170))}</div>`));
    if (e.kind === "spawn") {
      const s = sc.sess.find((x) => x.start === e.id), x = st(s), d = c.doneIds(s);
      out.push(m([e.id, s.hello, s.work, ...d, ...(s.commit ?? []).filter(seen), seen(s.end) && s.end], "a session card in the thread; it changes in place",
        `<div class="card" style="max-width:84%;margin-top:.4rem"><div class="k">${s.resumed ? "resumed" : "started"} · ${esc(s.n)} · ${e.at}</div>
        <div class="sl">${stDot(x)}<span>${stWord(x)}${x === "gone" ? " " + E(s.end).at : ""} · ${esc(s.goal)}</span></div>
        ${d.length ? `<div class="sm">✓ ${esc(s.res)}</div><div class="chips">${s.links.filter((l) => !l.startsWith("post")).map(chip).join("")}</div>` : ""}
        ${x === "with you" ? `<div class="sm">you are in its pane <span class="chip">open</span>; those turns are not in this thread</div>` : ""}</div>`));
    }
    if (e.kind === "ask") out.push(m([e.id, seen(sc.q.answer) && sc.q.answer], "a question card at its time, also pinned under the thread while open", `<div class="who">design-a-b · ${e.at} · inserted by cc, not sent by nadya</div><div class="card need" style="max-width:84%"><b>${esc(sc.q.t)}</b>${seen(sc.q.answer) ? `<div class="sm" style="color:var(--ok)">answered</div>` : `<div class="opts">${sc.q.opts.map((o) => `<button class="b">${o}</button>`).join("")}</div>`}</div>`));
    if (e.kind === "blog") out.push(m(e.id, "a post card in the thread", `<div class="who">post · ${e.at}</div><div class="card" style="max-width:84%;border-style:dashed"><div class="sm">${esc(cut(e.t.replace(/^<article[^>]*>\s*[\d:]+ · [^:]+: /, ""), 130))}</div></div>`));
  }
  const pin = sc.q && seen(sc.q.ev) && !seen(sc.q.answer) ? m(sc.q.ev, "a question card at its time, also pinned under the thread while open", `<div class="card need" style="margin:0"><div class="k">open question · design-a-b · ${E(sc.q.ev).at}</div><b>${esc(sc.q.t)}</b></div>`) : "";
  return `<div class="top"><b>nadya</b><span class="r">${c.at}</span></div>
    <div style="padding:.3rem .8rem">${out.join("")}</div>
    <div style="position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:.4rem .7rem">${pin}<div class="in" style="margin-top:.3rem"><span>message nadya…</span><button class="b pri">send</button></div></div>`;
}

function bar(sc, c) {

  const waiting = sc.q && seen(sc.q.ev) && !seen(sc.q.answer) ? m(sc.q.ev, "a row under 'waiting on you'; opens into its options", `<div class="row" style="background:#fff4e6">${stDot("asking")}<span class="t"><b>${esc(sc.q.t)}</b></span><time>design-a-b</time></div>`) : "";
  const recent = sc.sess.flatMap((s) => c.doneIds(s).map((d) => ({s, d}))).reverse().map(({s, d}) => m([d, ...(s.commit ?? []).filter(seen)], "a row under 'recent'", `<div class="row">${stDot("gone")}<span class="t">${esc(cut(E(d).t.replace(/^[\w-]+ (done|finished)[^:]*: ?/, ""), 95))}</span><time>${E(d).at}</time></div>`)).join("");

    sc.sess.some((s) => st(s) === "gone") && m(sc.sess.filter((s) => st(s) === "gone").map((s) => s.end), "found by search: 'closed sessions'", `<div class="grp">closed sessions</div>${sc.sess.filter((s) => st(s) === "gone").map((s) => `<div class="row"><span class="t">${esc(s.n)} <span class="xs muted">${esc(s.pid)} · ${esc(s.goal)}</span></span><time>${E(s.start).at}-${E(s.end).at}</time></div>`).join("")}`),

  return `<div style="padding:1rem .8rem .3rem"><div class="in" style="padding:.5rem .7rem;font-size:1rem"><span>ask nadya, find anything</span><span class="chip">/</span></div>
      <div class="sm muted" style="display:flex;gap:.7rem;justify-content:center;margin:.45rem 0">${status || "no session running"}<span>${c.at}</span></div></div>
    <div style="padding:0 .8rem">${answer}${waiting ? `<div class="grp">waiting on you</div>${waiting}` : ""}${recent ? `<div class="grp">recent</div>${recent}` : ""}
    <div style="margin-top:1rem;border-top:1px dashed var(--line);padding-top:.3rem"><div class="xs muted">and when you type "${sc.find}" in the box:</div>${hits || `<div class="xs muted">nothing yet</div>`}</div></div>`;
}

// ---------- 4. Rooms ----------
function rooms(sc, c) {
  const {seen, E, st} = c;
  const mine = sc.ev.filter((e) => seen(e.id) && (e.kind === "you" || e.kind === "reply") && !sc.others[e.id]?.room && !Object.values(sc.others).some((o) => o.reply === e.id));
  const otherRooms = Object.entries(sc.others).filter(([id]) => seen(id));
  const need = sc.q && seen(sc.q.ev) && !seen(sc.q.answer) ? 1 : 0;
  const tiles = [
    `<div class="tile open"><b>${sc.proj}</b> ${need ? `<span style="color:var(--q)">● ${need}</span>` : ""} ${c.live.length ? `<span style="color:var(--busy)">◐ ${c.live.length}</span>` : ""}<div class="xs muted">open below</div></div>`,
    ...otherRooms.filter(([, o]) => o.room !== sc.proj).map(([id, o]) => m([id, o.reply], `the ${o.room} room, not this one (your words name no room, so nadya tags it from the content)`, `<b>${o.room}</b><div class="xs muted">${E(id).at} you asked</div>`, "div", "tile")),
    `<div class="tile muted"><b>nadya</b><div class="xs">and 5 more</div></div>`,
  ].join("");
  const chat = mine.map((e) => m(e.id, e.kind === "you" ? `your message, in the ${sc.proj} room's chat (it starts "${sc.proj}:" or nadya tags it)` : `nadya's reply, in the ${sc.proj} room's chat`,
    `<div class="who ${e.kind === "you" ? "me" : ""}">${e.kind === "you" ? "you" : "nadya"} · ${e.at}</div><div class="bub ${e.kind === "you" ? "me" : ""}">${esc(cut(e.t, 130))}</div>`)).join("");
  const sameRoom = otherRooms.filter(([, o]) => o.room === sc.proj).map(([id, o]) => m(id, `in this room too: a ${o.by} row under sessions (same dir)`, `<div class="sl">${stDot("busy")}<b>${o.by}</b> <span class="muted">${esc(o.title)}</span></div>`)).join("");
  const sess = sc.sess.filter((s) => st(s)).map((s) => m([s.start, s.work, s.direct, seen(s.end) && s.end, s.ask && seen(s.ask) && s.ask, seen(s.answer) && s.answer], "a row under sessions: every session whose dir is this project",
    `<div class="sl">${stDot(st(s))}<span><b>${esc(s.n)}</b> <span class="xs muted">${esc(s.pid)}</span> ${stWord(st(s))}${st(s) === "asking" ? `: <b>${esc(sc.q.t)}</b>` : ""}${st(s) === "with you" ? ' <span class="chip">open pane</span>' : ""}</span></div>`)).join("");
  const res = sc.sess.filter((s) => c.doneIds(s).length).map((s) => m([...c.doneIds(s), ...(s.commit ?? []).filter(seen)], "a row under results", `<div class="sm" style="padding:.15rem 0">✓ ${esc(s.res)} <span class="xs muted">${esc(s.n)} ${E(c.doneIds(s).at(-1)).at}</span></div>`)).join("");
  const posts = [...new Set(sc.sess.flatMap((s) => (s.blog ?? []).filter(seen)))].map((id) => m(id, "a row under posts (the article's data-project)", `<div class="sm" style="padding:.15rem 0">${E(id).at} ${esc(cut(E(id).t.replace(/^<article[^>]*>\s*[\d:]+ · [^:]+: /, ""), 80))}</div>`)).join("");
  return `<div class="top"><b>cc</b><span class="sm muted">rooms</span><span class="r">${c.at}</span></div><div class="tiles">${tiles}</div>
    <div style="display:grid;grid-template-columns:1.2fr 1fr"><div style="padding:.4rem .6rem;border-right:1px solid var(--line)"><div class="grp">${sc.proj} · chat with nadya</div>${chat}</div>
    <div style="padding:.4rem .6rem"><div class="grp">sessions</div>${sess || '<div class="xs muted">none</div>'}${sameRoom}<div class="grp">results</div>${res || '<div class="xs muted">none yet</div>'}<div class="grp">posts</div>${posts || '<div class="xs muted">none yet</div>'}</div></div>`;
}

// ---------- 5. The day ----------
function day(sc, c) {
  const {seen, E, st} = c;
  const t0 = hours(sc.ev[0]) - 0.03, t1 = hours(sc.ev.at(-1)) + 0.03, hm = (h) => `${Math.floor(h)}:${String(Math.round((h % 1) * 60)).padStart(2, "0")}`, x = (h) => `${((h - t0) / (t1 - t0)) * 100}%`;
  const nowH = hours(sc.ev[c.now]);
  const lanes = sc.L.filter((l) => l.life).map((l) => {
    const ss = sc.sess.filter((s) => s.lane === l.k && st(s));
    return `<div class="lane"><span>${esc(l.n)}</span><div class="bar">${ss.map((s) => { const a = hours(E(s.start)), b = seen(s.end) ? hours(E(s.end)) : nowH;
      return m([s.start, s.work, s.direct, s.ask && seen(s.ask) && s.ask, seen(s.end) && s.end], "a lane bar from start to close; its colour is the state", "", "i", (st(s) ?? "").replace(" ", "")).replace("<i ", `<i style="left:${x(a)};width:max(3px,calc(${x(b)} - ${x(a)}))" `); }).join("")}</div></div>`;
  }).join("");
  const rows = [];
  for (const e of sc.ev) {
    if (!seen(e.id)) break;
    if (e.kind === "you") rows.push([e, m([e.id, sc.others[e.id]?.reply], "a row at its time: 'you: ...'; click opens nadya's replies", `<b>you</b>: ${esc(cut(e.t, 90))}`)]);
    if (e.kind === "spawn") { const s = sc.sess.find((y) => y.start === e.id); rows.push([e, m(e.id, "a row 'started' at its time", `${esc(s.n)} ${s.resumed ? "resumed" : "started"}: ${esc(s.goal)}`)]); }
    if (e.kind === "done") { const s = sc.sess.find((y) => y.done.includes(e.id)); const last = s.done.at(-1) === e.id;
      const extra = last ? [...(s.commit ?? []), ...(s.blog ?? []), s.end].filter(seen) : [];
      rows.push([e, m([e.id, ...extra], "one row 'done' with links; commit, post and close fold into it", `<b>${esc(s.n)} done</b>: ${esc(cut(e.t.replace(/^[\w-]+ (done|finished)[^:]*: ?/, ""), 80))}${extra.length ? `<div class="chips">${s.links.filter((l) => !l.startsWith("post") || s.blog?.some(seen)).map(chip).join("")}</div>` : ""}`)]); }
    if (e.kind === "answer") rows.push([e, m(e.id, "a row: you answered", `you answered design-a-b`)]);
    if (e.kind === "log") rows.push([e, m(e.id, "a folded row: nothing new", `<span class="muted">2 checks, nothing new (folded)</span>`)]);
    if (e.kind === "ask") rows.push([e, m(e.id, "pinned at the now line while open; a row at its time after", `<span style="color:var(--q)">design-a-b asked you</span>`)]);
  }
  const pin = sc.q && seen(sc.q.ev) && !seen(sc.q.answer) ? m(sc.q.ev, "pinned at the now line while open; a row at its time after", `<div class="card need" style="margin:.3rem 0 0"><b>${esc(sc.q.t)}</b><div class="opts">${sc.q.opts.map((o) => `<button class="b">${o}</button>`).join("")}</div></div>`) : "";
  return `<div class="top"><b>cc</b><span class="sm muted">Sat Oct 17th</span><span class="r">${c.at}</span></div>
    <div class="gantt"><div class="lane"><span></span><div class="xs muted" style="display:flex;justify-content:space-between"><span>${hm(t0)}</span><span>${hm(t1)}</span></div></div>${lanes}</div>
    <div class="tl" style="padding:.5rem .6rem"><div class="nowl"><b class="sm" style="color:var(--q)">now ${c.at}</b>${pin}<div class="in" style="margin-top:.3rem"><span>to nadya…</span></div></div>
    ${rows.reverse().map(([e, h]) => `<div class="r2"><time>${e.at}</time><div>${h}</div></div>`).join("")}</div>`;
}

const D = Object.fromEntries(DIRS.map((d) => [d.id, d]));
const STATE = {story: "files", now: null, sel: null};
const sc = () => STORIES[STATE.story];

// what each event becomes on each direction's screen, over every moment of the story
const FATE = {};
function fates(storyId) {
  if (FATE[storyId]) return FATE[storyId];
  const s = STORIES[storyId], tmp = document.createElement("div"), out = {};
  for (const d of DIRS) {
    const f = out[d.id] = {};
    s.ev.forEach((_, i) => {
      tmp.innerHTML = d.r(s, ctx(s, i));
      tmp.querySelectorAll("[data-src]").forEach((el) => el.dataset.src.split(" ").filter(Boolean).forEach((id) => (f[id] ??= new Set()).add(el.dataset.as)));
    });
  }
  return FATE[storyId] = out;
}
function fateOf(d, e) {
  const f = fates(STATE.story)[d.id][e.id];
  if (f?.size) return {on: true, t: [...f].join("; ")};
  return {on: false, t: d.hide[e.kind] ?? "hidden"};
}

function trace(d) {
  const s = sc(), now = STATE.now, W = 44;
  const alive = (l, i) => l.life?.some(([a, b]) => s.ix[a] <= i && i <= s.ix[b]) ?? (l.k === "you" || l.k === "nadya");
  const hd = `<div class="hd"><span style="padding-left:.35rem">time</span><div class="lanes">${s.L.map((l) => `<span><b style="color:${l.c}">${esc(l.n)}</b>${esc(l.sub ?? "")}</span>`).join("")}</div><span style="padding-left:.4rem">event (real text)</span><span style="padding-left:.4rem">on this screen</span></div>`;
  const rows = s.ev.map((e, i) => {
    const fi = s.li[e.from], ti = e.to != null ? s.li[e.to] : null, L = s.L[fi];
    const lives = s.L.map((l, k) => alive(l, i) ? `<i class="life" style="left:${k * W + W / 2}px;background:${l.c}33"></i>` : "").join("");
    const ln = ti != null ? `<i class="ln ${ti > fi ? "r" : "l"}" style="left:${Math.min(fi, ti) * W + W / 2}px;width:${Math.abs(ti - fi) * W}px;color:${L.c}"></i>` : "";
    const dot = `<i class="dot ${e.kind === "tools" || e.kind === "quiet" ? "sq" : ""}" style="left:${fi * W + W / 2}px;background:${L.c}"></i>`;
    const f = fateOf(d, e);
    const kindWord = {you: "", reply: "", spawn: "starts session", msg: "SendMessage", done: "SendMessage", tools: "tool calls", trig: "", commit: "", blog: "blog post", close: "closes", ask: "dialog", answer: "answers", direct: "types in its pane", quiet: "", log: "log"}[e.kind];
    return `<div class="ev ${i > now ? "after" : ""} ${i === now ? "cur" : ""}" data-ev="${e.id}" data-i="${i}" title="${esc(e.t)}"><time>${e.at}</time>
      <div class="lc">${lives}${ln}${dot}</div><div class="t">${kindWord ? `<i>${kindWord}</i> ` : ""}${esc(e.t)}</div><div class="f ${f.on ? "on" : "hid"}" title="${esc(f.t)}">${f.on ? "→ " : ""}${esc(f.t)}</div></div>`;
  }).join("");
  const sel = s.byId[STATE.sel] ?? s.ev[now];
  const f = fateOf(d, sel);
  const det = `<div class="det"><div class="k">${sel.at} · ${esc(sel.from)}${sel.to ? " → " + esc(sel.to) : ""} · kept in</div><div class="sm">${esc(WHERE[sel.kind])}</div>
    <div class="raw">${esc(sel.t)}</div><div class="k">on this screen</div><div class="sm">${f.on ? "" : '<span class="muted">not drawn: </span>'}${esc(f.t)}</div></div>`;
  return `<div class="tr" style="--n:${s.L.length}">${hd}${rows}</div>${det}`;
}

    ${[["1 jobs", "a line on the job card under your words", "the card's result; card moves to done at close", "the card moves to needs you", "your request (a job id in the brief)"],
      ["2 conversation", "a session card in nadya's thread", "the card's result line, in place", "a card at 09:42, pinned above the box", "nothing: time order"],
      ["3 command bar", "a name in the status line", "a row under recent", "a row under waiting on you", "nothing; search finds things"],
      ["4 rooms", "a row under the cc room's sessions", "a row under the room's results", "the session's row + a count on the tile", "project, from the dir"],
      ["5 the day", "a bar starts; a row 'started'", "a row 'done' with links; the bar ends", "pinned on the now line, the bar turns orange", "time"]]
      .map((r) => `<tr>${r.map((c, i) => `<td>${i ? c : `<b>${c}</b>`}</td>`).join("")}</tr>`).join("")}</tbody></table>
    <p class="sm">Only jobs needs data that does not exist today (which sessions a request caused). The others regroup what cchost, the transcripts, the blog and nadya-log.md already have. Earlier round (what changes, 6 flows): <a href="assistant.html">assistant.html</a>.</p></section>`;
  draw();
}
function draw() {
  const s = sc();
  STATE.now ??= s.ev.length - 1;
  document.getElementById("pick").innerHTML = Object.entries(STORIES).map(([k, v]) => `<button class="b" data-story="${k}" aria-pressed="${k === STATE.story}">${esc(v.n)}</button>`).join(" ");
  document.getElementById("nowctl").innerHTML = `<button class="b" data-step="-1">◀</button> screen at <b>${s.ev[STATE.now].at}</b> (${STATE.now + 1}/${s.ev.length}) <button class="b" data-step="1">▶</button> <button class="b" data-step="end">end</button>`;
  for (const d of DIRS) {
    const sec = M.querySelector(`section[data-d="${d.id}"]`);
    sec.querySelector("[data-trace]").innerHTML = trace(d);
    const scr = sec.querySelector("[data-scr]"), top = scr.scrollTop;
    scr.innerHTML = d.r(s, ctx(s, STATE.now));
    scr.querySelectorAll("[data-src]").forEach((el) => el.dataset.src.split(" ").includes(s.ev[STATE.now].id) && el.classList.add("fresh"));
    scr.scrollTop = top;
    sec.querySelector("[data-at]").textContent = `at ${s.ev[STATE.now].at}, after "${cut(s.ev[STATE.now].t, 40)}"`;
  }
}
function light(sec, ids) {
  sec.querySelectorAll(".lit").forEach((el) => el.classList.remove("lit"));
  if (!ids) return;
  sec.querySelectorAll("[data-ev]").forEach((el) => ids.includes(el.dataset.ev) && el.classList.add("lit"));
  sec.querySelectorAll("[data-src]").forEach((el) => el.dataset.src.split(" ").some((x) => ids.includes(x)) && el.classList.add("lit"));
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-story],[data-step],[data-ev],[data-src]");
  if (!t) return;
  const s = sc();
  if (t.dataset.story) { Object.assign(STATE, {story: t.dataset.story, now: null, sel: null}); frame(); return; }
  if (t.dataset.step) STATE.now = t.dataset.step === "end" ? s.ev.length - 1 : Math.max(0, Math.min(s.ev.length - 1, STATE.now + +t.dataset.step)), STATE.sel = null;
  else if (t.dataset.ev) Object.assign(STATE, {now: +t.dataset.i, sel: t.dataset.ev});
  else if (t.dataset.src) STATE.sel = t.dataset.src.split(" ").filter(Boolean).at(-1);
  draw();
});
document.addEventListener("mouseover", (e) => {
  const sec = e.target.closest("section[data-d]");
  if (!sec) return;
  const t = e.target.closest("[data-ev],[data-src]");
  light(sec, t ? (t.dataset.ev ? [t.dataset.ev] : t.dataset.src.split(" ").filter(Boolean)) : null);
});
frame();
</script>
