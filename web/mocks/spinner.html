<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cc spinner mocks</title>
<style>
  :root {
    --bg: #fff; --text: #212529; --muted: #6c757d; --line: #e9ecef; --accent: #0b7bd3; --on-accent: #fff; --bubble: #f3f4f6;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; --mono: ui-monospace, Menlo, Consolas, monospace;
  }
  .dark { --bg: #17181a; --text: #e6e6e6; --muted: #9aa0a6; --line: #2c2e31; --bubble: #26282b; --accent: #2b8ae0; }
  * { box-sizing: border-box; }
  main + main { margin-top: 1px; }
  body { margin: 0; background: #ddd; font: 15px/1.5 var(--font); }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 1px; }
  section { background: var(--bg); color: var(--text); padding: 0.8rem 1.2rem 1.4rem; }
  h2 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 400; margin: 0 0 0.6rem; }
  .msgs { display: flex; flex-direction: column; gap: 0.5rem; }
  .m { align-self: flex-start; max-width: 78%; padding: 0.5rem 0.8rem; border-radius: 12px; background: var(--bubble); overflow-wrap: anywhere; }
  .m.me { align-self: flex-end; background: var(--accent); color: var(--on-accent); } .m.me small { text-align: right; }
  .m small { display: block; text-align: left; font-size: 0.6rem; opacity: 0.7; margin-top: 0.15rem; }
  .m p { margin: 0; }

  /* 1 current: ring */
  .v1 { align-self: flex-start; width: 0.9rem; height: 0.9rem; margin: 0.1rem 0.8rem; border: 2px solid var(--line); border-top-color: var(--muted); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 2 typing dots in a bubble */
  .v2 { align-self: flex-start; display: flex; gap: 4px; padding: 0.75rem 0.9rem; border-radius: 12px; background: var(--bubble); }
  .v2 i, .v3 i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: bob 1.2s ease-in-out infinite; }
  .v2 i:nth-child(2), .v3 i:nth-child(2) { animation-delay: 0.15s; } .v2 i:nth-child(3), .v3 i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bob { 0%, 60%, 100% { opacity: 0.3; transform: none; } 30% { opacity: 1; transform: translateY(-3px); } }

  /* 3 bare dots */
  .v3 { align-self: flex-start; display: flex; gap: 4px; padding: 0.3rem 0.8rem; }
  .v3 i { width: 6px; height: 6px; }

  /* 4 pulsing dot */
  .v4 { align-self: flex-start; width: 9px; height: 9px; margin: 0.3rem 0.85rem; border-radius: 50%; background: var(--accent); animation: pulse 1.4s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 50%, transparent); } 100% { box-shadow: 0 0 0 9px transparent; } }

  /* 5 Claude Code glyphs + word */
  .v5 { align-self: flex-start; padding: 0 0.8rem; color: #d97757; font-size: 0.85rem; }
  .v5 b { display: inline-block; width: 1em; text-align: center; font-weight: 400; }
  .v5 span { color: var(--muted); }

  /* 6 shimmer text */
  .v6 { align-self: flex-start; padding: 0 0.8rem; font-size: 0.85rem; color: transparent; background: linear-gradient(90deg, var(--muted) 40%, var(--text) 50%, var(--muted) 60%) 0 0 / 300% 100%; -webkit-background-clip: text; background-clip: text; animation: shim 1.8s linear infinite; }
  @keyframes shim { from { background-position: 100% 0; } to { background-position: 0 0; } }

  /* 7 ring + elapsed */
  .v7 { align-self: flex-start; display: flex; align-items: center; gap: 0.45rem; padding: 0 0.8rem; font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .v7::before { content: ""; width: 0.75rem; height: 0.75rem; border: 2px solid var(--line); border-top-color: var(--muted); border-radius: 50%; animation: spin 0.8s linear infinite; }

  /* 8 thin bar */
  .v8 { align-self: flex-start; width: 3rem; height: 3px; margin: 0.4rem 0.8rem; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--muted), transparent) 0 0 / 50% 100% no-repeat var(--line); animation: bar 1.1s ease-in-out infinite; }
  @keyframes bar { from { background-position: -100% 0; } to { background-position: 200% 0; } }
</style>
<main><section><h2>2 · reply arriving</h2><div class="msgs" id="demo"></div></section><section class="dark"><h2>2 · reply arriving · dark</h2><div class="msgs" id="demo2"></div></section></main>
<main id="grid"></main>
<script type="module">
const variants = [
  ["1 · now: ring", `<div class="v1"></div>`],
  ["2 · dots in a bubble", `<div class="v2"><i></i><i></i><i></i></div>`],
  ["3 · dots, no bubble", `<div class="v3"><i></i><i></i><i></i></div>`],
  ["4 · pulsing dot", `<div class="v4"></div>`],
  ["5 · Claude Code glyph", `<div class="v5"><b>✻</b> <span>working…</span></div>`],
  ["6 · shimmer text", `<div class="v6">working…</div>`],
  ["7 · ring + time", `<div class="v7" data-t>0:42</div>`],
  ["8 · bar", `<div class="v8"></div>`],
];
const chat = `<div class="m me"><p>can you check why the blog build failed?</p><small>14:02</small></div>
<div class="m"><p>Looking at it now. The inbox has two posts with the same id.</p><small>14:02 · 3 tool calls</small></div>`;
{
  const g = document.querySelector("#grid");
  g.innerHTML = ["", "dark"].map((th) => variants.map(([label, html]) =>
    `<section class="${th}"><h2>${label}${th ? " · dark" : ""}</h2><div class="msgs">${chat}${html}</div></section>`).join("")).join("");
}
function grow(el, from) {
  const {width, height} = el.getBoundingClientRect();
  const ease = {duration: 350, easing: "cubic-bezier(0.2, 0.8, 0.2, 1)"};
  el.animate([{clipPath: `inset(0 ${Math.max(0, width - from.width)}px ${Math.max(0, height - from.height)}px 0 round 12px)`}, {clipPath: "inset(0 round 12px)"}], ease);
  for (const c of el.children) c.animate([{opacity: 0}, {opacity: 0, offset: 0.4}, {opacity: 1}], ease);
}
const me = `<div class="m me"><p>can you check why the blog build failed?</p><small>14:02</small></div>`;
const dotsHtml = `<div class="v2"><i></i><i></i><i></i></div>`;
const reply = `<div class="m"><p>Found it: two posts in the inbox had the same id. I renamed the second one and the build passes now.</p><small>14:03 · 5 tool calls</small></div>`;
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
async function demo(box) {
  for (;;) {
    box.innerHTML = me;
    await wait(700);
    box.innerHTML = me + dotsHtml;
    await wait(2500);
    const from = box.querySelector(".v2").getBoundingClientRect();
    box.innerHTML = me + reply;
    grow(box.lastElementChild, from);
    await wait(2500);
  }
}
demo(document.querySelector("#demo"));
demo(document.querySelector("#demo2"));
const glyphs = ["·", "✢", "✳", "✶", "✻", "✽", "✻", "✶", "✳", "✢"];
let n = 0, t = 42;
setInterval(() => { n++; for (const b of document.querySelectorAll(".v5 b")) b.textContent = glyphs[n % glyphs.length]; }, 120);
setInterval(() => { t++; for (const e of document.querySelectorAll("[data-t]")) e.textContent = `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`; }, 1000);
</script>
