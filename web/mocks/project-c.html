  const es = evs.filter((e) => (kind === "all" || e.k === kind) && (!part || e.part === part));
  let tl = "", last = "";
  for (const e of es.slice(0, 120)) { const d = e.t.slice(0, 10); if (d !== last) { tl += `<div class="day">${day(d)}</div>`; last = d; } tl += ev(e); }
  const cnt = (k) => evs.filter((e) => e.k === k && (!part || e.part === part)).length;
  const open = todosOf(p.id).filter((t) => !t.done && (!part || t.part === part));
  const fs = (D.files[p.id] ?? []).filter((f) => !part || f.part === part).sort((a, b) => (b.d || "").localeCompare(a.d || ""));
  const ds = (D.docs[p.id] ?? (p.mock ? [{kind: "mock", title: "mock", url: p.mock}] : [])).filter((d) => !part || !d.part || d.part === part);
  document.getElementById("view").innerHTML = `<div id="note" class="wide"><p>Mock C, project page as history: everything the project did in one timeline, newest first (posts with their pictures, ${D.commits[p.id] ? "commits," : "commits (not in the mock for this project: its repo is on marx),"} files changed, todos done), filtered by kind${p.parts ? " and by part" : ""}. On the right, what is open: todos, docs and mocks, files.</p></div>
  <article class="wide"><div class="top"><h1>${esc(p.title)}</h1>${p.kind === "idea" ? pill({state: "idea"}) : pill(p)}<span class="meta">${esc(p.sub)}</span></div>
  <div class="cols"><section>
    <div class="chips">${["all", "post", "commit", "file", "todo"].map((k) => `<button data-k="${k}" aria-pressed="${kind === k}">${k === "all" ? "everything" : k === "todo" ? "todos done" : k + "s"} <small>${k === "all" ? evs.length : cnt(k)}</small></button>`).join("")}</div>
    ${p.parts ? `<div class="chips"><button data-p="" aria-pressed="${!part}">all parts</button>${p.parts.map((x) => `<button data-p="${x.k}" aria-pressed="${part === x.k}">${x.k}</button>`).join("")}<span class="tag" style="align-self:center">a post tagged only "arcade" gets its part from its text</span></div>` : ""}
    ${tl || `<p class="meta">nothing yet</p>`}${es.length > 120 ? `<p class="meta">${es.length - 120} older</p>` : ""}
  </section><aside>
    <dl style="margin:.4rem 0 0"><dd style="margin:0">${p.dir ? `<code>${esc(p.dir)}</code>` : "no dir yet"}</dd><dd style="margin:0">${p.notes.map((x) => `<a href="#">${x}</a>`).join(", ")}</dd></dl>
    ${p.guess ? `<p><span class="guess" style="white-space:normal">${esc(p.guess)} <button>yes</button><button>no</button></span></p>` : ""}
    <p class="status">${esc(p.status)}</p>
    <h2 class="h">todo (${open.length})</h2><ul class="rows">${open.map((t) => `<li class="trow"><span class="tt">${t.part && !part ? `<span class="pill">${t.part}</span> ` : ""}${esc(t.text)}${t.stale ? `<br><span class="stale">⚠ ${esc(t.stale)}</span>` : ""}${t.how === "guess" ? `<br>${guessChip(t)}` : ""}</span><small>${t.when ?? t.plan ?? ""}</small></li>`).join("") || "<li class=meta>nothing open</li>"}</ul>
    <h2 class="h">docs, mocks, pages</h2><ul class="rows">${ds.map(docRow).join("") || "<li class=meta>none</li>"}</ul>
    <h2 class="h">files</h2><ul class="rows">${fs.map((f) => `<li><span class="mono" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left;flex:1">${esc(f.path.replace(/^~\//, ""))}</span><small>${f.d ? ago(f.d + " 12:00") : "marx"}</small></li>`).join("") || "<li class=meta>not in the mock</li>"}</ul>
  </aside></div></article>`;
  for (const b of document.querySelectorAll("[data-k]")) b.onclick = () => { kind = b.dataset.k; draw(); };
  for (const b of document.querySelectorAll("[data-p]")) b.onclick = () => { part = b.dataset.p; draw(); };
}
draw();
</script></body></html>
