<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cc assistant mocks</title>
<style>
:root { --bg: #fff; --page: #f3f4f6; --text: #1f2328; --muted: #6b7280; --line: #e2e4e8; --hover: #f3f4f6; --cur: #e8f0fb;
  --accent: #1f6feb; --q: #d9480f; --ok: #2b8a3e; --busy: #1971c2; --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, Menlo, Consolas, monospace; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text); font: 15px/1.45 var(--font); }
body > header { position: sticky; top: 0; z-index: 9; background: #fff; border-bottom: 1px solid var(--line); padding: 0.5rem 1rem; display: flex; gap: 0.3rem 1rem; flex-wrap: wrap; align-items: baseline; }
body > header a { color: var(--accent); text-decoration: none; font-size: 0.88rem; }
body > main { max-width: 1180px; margin: 0 auto; padding: 0 1rem 4rem; }
h2 { font-size: 1.2rem; margin: 2.4rem 0 0.1rem; padding-top: 0.6rem; border-top: 2px solid #c9ccd1; }
h2 + .lede { margin: 0 0 0.6rem; color: var(--muted); }
.ctl { display: flex; flex-wrap: wrap; gap: 0.3rem; align-items: center; margin: 0.4rem 0; }
.ctl button, .b { font: inherit; font-size: 0.8rem; border: 1px solid #c5cad1; background: #fff; border-radius: 6px; padding: 0.12rem 0.5rem; cursor: pointer; color: var(--text); white-space: nowrap; }
.ctl button[aria-pressed="true"] { background: var(--text); color: #fff; border-color: var(--text); }
.ctl .sp { flex: 1; }
.b:hover { background: var(--hover); }
.b.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
.stage { display: flex; justify-content: center; background: #e9eaed; border-radius: 8px; padding: 0.8rem; }
.fr { background: var(--bg); border: 1px solid #c9ccd1; border-radius: 8px; width: 100%; height: 600px; overflow: hidden; display: flex; flex-direction: column; font-size: 13.5px; position: relative; }
.fr.ph { width: 380px; height: 720px; border-radius: 22px; border-width: 6px; border-color: #2b2b2b; }
.fr.ph .donly { display: none !important; }
.fr:not(.ph) .ponly { display: none !important; }
.cap { margin: 0.4rem 0 0; font-size: 0.88rem; min-height: 1.4em; }
.cap b { color: var(--q); font-weight: 600; }
details.org { background: #fff; border: 1px solid var(--line); border-radius: 8px; margin: 0.6rem 0 0; padding: 0.4rem 0.8rem; font-size: 0.86rem; }
details.org summary { cursor: pointer; font-weight: 600; }
.org h4 { margin: 0.6rem 0 0.1rem; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
.org ul { margin: 0; padding-left: 1.1rem; }
.org li { margin: 0.12rem 0; }
code { font: 0.8em var(--mono); background: #f1f3f5; padding: 0 0.2rem; border-radius: 3px; }

/* parts used inside frames */
.top { display: flex; align-items: center; gap: 0.6rem; padding: 0.45rem 0.8rem; border-bottom: 1px solid var(--line); flex: none; }
.top b { font-size: 0.95rem; }
.top .r { margin-left: auto; color: var(--muted); font-size: 0.78rem; white-space: nowrap; }
.body { flex: 1; min-height: 0; display: flex; }
.scroll { overflow: auto; min-height: 0; }
.muted { color: var(--muted); }
.sm { font-size: 0.78rem; }
.xs { font-size: 0.72rem; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #adb5bd; flex: none; }
.dot.busy { background: var(--busy); } .dot.q { background: var(--q); } .dot.ok { background: var(--ok); } .dot.wait { background: #f59f00; }
.lk { color: var(--accent); cursor: pointer; text-decoration: none; }
.lk:hover { text-decoration: underline; }
.chip { display: inline-flex; gap: 0.25rem; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: 0 0.45rem; font-size: 0.74rem; white-space: nowrap; background: #fff; }
.chip.lkc { color: var(--accent); cursor: pointer; }
.chips { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-top: 0.25rem; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 0.5rem 0.65rem; background: #fff; margin: 0 0 0.5rem; }
.card.click { cursor: pointer; } .card.click:hover { border-color: #aeb6c0; }
.card.need { border-left: 3px solid var(--q); }
.card.hl { box-shadow: 0 0 0 2px #ffd8a8; }
.card h5 { margin: 0 0 0.15rem; font-size: 0.88rem; }
.card .k { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
.opts { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.4rem; }
.col { flex: 1; min-width: 0; padding: 0.6rem; border-right: 1px solid var(--line); }
.col:last-child { border-right: 0; }
.col > .h { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 0.4rem; display: flex; justify-content: space-between; }
.in { display: flex; gap: 0.4rem; align-items: center; border: 1px solid #c5cad1; border-radius: 10px; padding: 0.35rem 0.6rem; background: #fff; }
.in span { flex: 1; color: var(--muted); }
.in span.typed { color: var(--text); }
.row { display: flex; gap: 0.5rem; align-items: baseline; padding: 0.3rem 0.4rem; border-radius: 6px; cursor: pointer; }
.row:hover { background: var(--hover); }
.row .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row time { color: var(--muted); font-size: 0.72rem; white-space: nowrap; }
.grp { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0.7rem 0.4rem 0.2rem; }
.bub { border-radius: 12px; padding: 0.4rem 0.65rem; margin: 0.3rem 0; max-width: 78%; background: #f1f3f5; }
.bub.me { background: #dbe7fb; margin-left: auto; }
.who { font-size: 0.7rem; color: var(--muted); margin-top: 0.5rem; }
.toast { position: absolute; right: 12px; bottom: 12px; background: #1f2328; color: #fff; border-radius: 8px; padding: 0.5rem 0.75rem; font-size: 0.8rem; max-width: 300px; z-index: 3; }
.fr.ph .toast { left: 12px; right: 12px; top: 10px; bottom: auto; max-width: none; }
.tabbar { display: flex; border-top: 1px solid var(--line); flex: none; }
.tabbar button { flex: 1; font: inherit; font-size: 0.75rem; background: none; border: 0; padding: 0.5rem 0; color: var(--muted); cursor: pointer; }
.tabbar button[aria-pressed="true"] { color: var(--text); font-weight: 600; }
.sheet { position: absolute; top: 0; right: 0; bottom: 0; width: 46%; background: #fff; border-left: 1px solid var(--line); box-shadow: -6px 0 18px #0001; display: flex; flex-direction: column; z-index: 2; }
.fr.ph .sheet { width: 100%; top: 8%; border-radius: 14px 14px 0 0; border-top: 1px solid var(--line); }
.tl { position: relative; padding-left: 4.2rem; }
.tl .ev { position: relative; padding: 0.25rem 0 0.25rem 0.7rem; border-left: 2px solid var(--line); }
.tl .ev time { position: absolute; left: -4rem; width: 3.4rem; text-align: right; color: var(--muted); font-size: 0.72rem; top: 0.35rem; }
.tl .now { border-left: 2px solid var(--q); padding: 0.4rem 0 0.4rem 0.7rem; }
.tl .now::before { content: ""; position: absolute; left: -4rem; right: 0; border-top: 1px dashed var(--q); margin-top: -0.4rem; }
.lane { display: grid; grid-template-columns: 6.5rem 1fr; align-items: center; gap: 0.4rem; font-size: 0.74rem; margin: 2px 0; }
.lane .bar { position: relative; height: 14px; background: #f6f7f9; border-radius: 3px; }
.lane .bar i { position: absolute; top: 2px; bottom: 2px; border-radius: 3px; background: #a5c3ef; cursor: pointer; }
.lane .bar i.live { background: var(--busy); }
.lane .bar i.q { background: var(--q); }
.tile { border: 1px solid var(--line); border-radius: 10px; padding: 0.6rem; cursor: pointer; background: #fff; display: flex; flex-direction: column; gap: 0.2rem; }
.tile:hover { border-color: #aeb6c0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 0.6rem; }
.fr.ph .tiles { grid-template-columns: 1fr 1fr; }
.fr.ph .tile { padding: 0.45rem; }
.seg { display: flex; gap: 0.2rem; padding: 0.3rem 0.5rem; border-bottom: 1px solid var(--line); flex: none; }
.seg button { font: inherit; font-size: 0.76rem; border: 0; background: none; padding: 0.15rem 0.5rem; border-radius: 6px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--cur); color: var(--text); }
.mock { font-size: 0.7rem; color: #a0522d; }
section.insp ol { padding-left: 1.3rem; }
section.insp li { margin: 0.25rem 0; }
</style>
</head>
<body>
<header>
  <b>cc assistant mocks · Oct 17th</b>
  <a href="#jobs">1 jobs</a><a href="#talk">2 one conversation</a><a href="#bar">3 command bar</a><a href="#rooms">4 rooms</a><a href="#day">5 the day</a><a href="#compare">compare</a><a href="#insp">inspiration</a>
</header>
<main id="m"></main>
<script type="module">
// Data from Oct 17th 13:05: ccx list, ~/web/blog/index.html, ~/nadya/nadya-log.md, tracker packages.json,
// todo/reminders.md, dream/2026-10-17/for-nadya.md, ccx burn 5. Items marked "mock" are written for the page.
const NOW = "13:05", USE = "74% · 1.9x";
const LIVE = [
  {n: "cc-a", st: "busy", dir: "~/ai/cc/web", goal: "files tab: live grep through a lemon box", at: "12:59", cost: "0.3%"},
  {n: "cc-b", st: "busy", dir: "~/ai/cc/web", goal: "assistant mocks + Dribbble", at: "13:00", cost: "0.1%"},
  {n: "nadya", st: "wait", dir: "~/nadya", goal: "coordinator", at: "10:11", cost: "0.9%"},
];
// Jobs: one request from the user's words to its result. Times from nadya-log ("started ... (user)", "done").
const JOBS = [
  {id: "grep", room: "cc", ask: "files tab: search inside files", askAt: "12:59", by: ["cc-a"], st: "q", cost: "",
    last: "asks: search ~/web/blog too, or ~/nadya only?", links: [], q: "q2"},
  {id: "mocks", room: "cc", ask: "cc mocks, more aggressive, look at Dribbble", askAt: "13:00", by: ["cc-b"], st: "busy", cost: "0.1%",
    last: "writing mocks/assistant.html", links: []},
  {id: "backup", room: "nadya", ask: "(from dream) add ~/ai to the nightly backup?", askAt: "Oct 13", by: ["dream"], st: "q", cost: "",
    last: "open since Oct 13th; Sunday 10:15 reminder", links: ["dream/2026-10-17/for-nadya.md"], q: "q1"},
  {id: "flow", room: "cc", ask: "cc flow mocks", askAt: "10:46", doneAt: "10:58", by: ["cc-a"], st: "done", cost: "",
    last: "15 clickable mocks: links, important messages, chat vs blog, questions, finding things", links: ["cc/mocks/flow.html", "d67ccf1"]},
  {id: "316", room: "design-a", ask: "find the missing episode 3-16", askAt: "09:29", doneAt: "10:48", by: ["design-a-b"], st: "done", cost: "0.2%",
    last: "3-16 is broadcast #56 from Bilibili (Chinese subs, 720p); all 60 episodes play", links: ["design-a viewer", "5517519"]},
  {id: "foot", room: "home", ask: "amazon.ca equivalent of UK B09V7VNZ9Y", askAt: "09:37", doneAt: "09:43", by: ["shopping-a"], st: "done", cost: "0.1%",
    last: "footrest equivalents on amazon.ca", links: ["agents/shopping/2026-10-17-footrest.md"]},
  {id: "self", room: "nadya", ask: "list of services worth self-hosting (viceconsole post + HN)", askAt: "09:16", doneAt: "09:21", by: ["nadya-b"], st: "done", cost: "0.1%",
    last: "21 services; top picks Vaultwarden, Immich, Audiobookshelf; your answers saved", links: ["research/self-host.html", "91b466f", "ideas/password-sync.md"]},
  {id: "ep", room: "design-a", ask: "explainer page for episode 1-14, Claude vs Gemini", askAt: "08:49", doneAt: "09:28", by: ["design-a-a", "design-a-b"], st: "done", cost: "0.5%",
    last: "reports/1-14.html final, with a template; Gemini side cost $0.36", links: ["reports/1-14.html", "ed9cf63"]},
  {id: "arc", room: "arcist", ask: "new tab always in the Arc server space", askAt: "08:56", doneAt: "08:58", by: ["arcist-a"], st: "done", cost: "0.1%",
    last: "new-tab --space server", links: ["1739680"]},
  {id: "info", room: "nadya", ask: "research the information flow (from dream's idea)", askAt: "08:42", doneAt: "08:48", by: ["nadya-a"], st: "done", cost: "",
    last: "11 of 13 report questions never answered; four cc directions", links: ["research/info-flow.html", "98902fd"]},
  {id: "push", room: "nadya", ask: "push retry yes (trip answers)", askAt: "08:32", doneAt: "08:34", by: ["nadya-a"], st: "done", cost: "",
    last: "phone pushes retry every 5 min until the phone answers", links: ["18a1dcc"]},
];
const Q = {
  q1: {from: "dream, via nadya", t: "Add ~/ai (minus credentials) to the nightly backup?", why: "tools/backup.sh takes only ai/cc and ai/apis. While marx travels, nadya's copy is the only other one, with no history.", at: "Oct 13th", opts: ["Yes", "No", "Ask after the trip"]},
  q2: {from: "cc-a", t: "Search results: grep ~/nadya only, or ~/web/blog too?", why: "Blog posts are already listed by date; grep would find words inside them.", at: "13:04", opts: ["~/nadya only", "Add ~/web/blog"], mock: true},
};
const PKG = [
  {n: "Dönerino", via: "Uber Eats", st: "Preparing your order", eta: "13:28", hot: true},
  {n: "DORANA initial necklace", via: "Amazon · ASL", st: "Arriving today", eta: "today"},
  {n: "Ecualama order #109280", via: "FedEx", st: "At local FedEx facility, Quito", eta: "no date"},
  {n: "ROUNY handheld vacuum", via: "Amazon · Intelcom", st: "tracker error (Intelcom page answered HTML)", eta: "Oct 21"},
];
const REM = [
  {at: "Sun 10:10", who: "user", t: "online check-in AC 407 Montréal 10:10 → Toronto, AC 2115 → Nassau"},
  {at: "Sun 10:15", who: "nadya", t: "ask: add ~/ai to the nightly backup?"},
  {at: "Sun 18:00", who: "user", t: "WhatsApp Katrina her todo list"},
  {at: "Mon 07:30", who: "nadya", t: "park the hard queue, pause RBC sync, stop marx agents"},
];
const FIND = [
  {k: "report", t: "research/self-host.html", s: "21 services worth self-hosting · nadya-b · 09:21"},
  {k: "post", t: "21 services worth self-hosting, top picks Vaultwarden, Immich, Audiobookshelf", s: "blog · 09:21"},
  {k: "session", t: "nadya-b (closed)", s: "e53672a1 · 09:16-09:25 · 22 msgs"},
  {k: "idea", t: "ideas/password-sync.md", s: "line 20: Vaultwarden self-hosted on pravda"},
  {k: "idea", t: "ideas/linkding.md", s: "line 15: Readeck (nadya-b, Oct 17th)"},
  {k: "grep", t: "grep \"self-host\" in ~/nadya", s: "10 files: nadya-log.md, CLAUDE.md, ideas/habit-tracking.md, research/package-tracking.md…"},
];
const TALK = [
  {me: 1, at: "08:32", t: "Time Machine at home only is fine. marx is online at the offsite. No ~/prj copy. Low-tier marx agents OK during the trip. No away page. Push retry yes."},
  {at: "08:32", t: "Saved to your profile and dream's page. Started nadya-a on push retry."},
  {at: "08:34", card: "push"},
];

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);
const job = (id) => JOBS.find((j) => j.id === id);
const lk = (l) => `<span class="chip lkc">${/^[0-9a-f]{7}$/.test(l) ? `⎇ ${l}` : esc(l)}</span>`;
const links = (ls) => ls.length ? `<div class="chips">${ls.map(lk).join("")}</div>` : "";
const dot = (st) => `<span class="dot ${st}"></span>`;
const opts = (q, s) => s.answered === q ? `<div class="sm" style="color:var(--ok);margin-top:.3rem">✓ "${esc(s.pick)}" sent to ${esc(Q[q].from.split(",")[0])}</div>`
  : `<div class="opts">${Q[q].opts.map((o) => `<button class="b" data-answer="${q}" data-pick="${esc(o)}">${esc(o)}</button>`).join("")}<button class="b muted">write…</button></div>`;
const qcard = (q, s, extra = "") => `<div class="card need ${extra}"><div class="k">asks you · ${esc(Q[q].from)} · ${Q[q].at}${Q[q].mock ? ` <span class="mock">(mock)</span>` : ""}</div>
  <h5>${esc(Q[q].t)}</h5><div class="sm muted">${esc(Q[q].why)}</div>${opts(q, s)}</div>`;
const pkgline = (p, s) => p.hot && s.flow === "pkg" ? "at the door · 13:27" : `${p.st} · ${p.eta}`;
const FLOWS = [["open", "open"], ["done", "a done task"], ["ask", "a question"], ["find", "find an old result"], ["pkg", "a package arrives"], ["talk", "talk to nadya"]];

// ---------- 1. Jobs ----------
function jobCard(j, s) {
  const hl = (s.flow === "done" && j.id === "self") ? "hl" : "";
  return `<div class="card click ${j.st === "q" ? "need" : ""} ${hl}" data-sub="job:${j.id}">
    <div class="k">${esc(j.room)} · ${j.askAt}${j.doneAt ? ` → ${j.doneAt}` : ""}${j.cost ? ` · ${j.cost}` : ""}</div>
    <h5>${esc(j.ask)}</h5>
    <div class="sm" style="display:flex;gap:.3rem;align-items:baseline">${dot(j.st === "done" ? "ok" : j.st)} <span>${j.by.join(", ")}: ${esc(j.last)}</span></div>${links(j.links)}</div>`;
}
function jobs(s) {
  const top = `<div class="top"><b>cc</b><span class="r">${USE}</span></div>`;
  if (s.sub?.startsWith("job:")) {
    const j = job(s.sub.slice(4));
    const steps = [
      `<div class="ev"><time>${j.askAt}</time><div class="bub me" style="max-width:100%">${esc(j.ask)}</div></div>`,
      `<div class="ev"><time>${j.askAt}</time>nadya started ${j.by.map((b) => `<span class="lk">${b}</span>`).join(", ")} <span class="muted sm">· open its chat</span></div>`,
      ...(j.q ? [`<div class="ev"><time>${Q[j.q].at}</time>${qcard(j.q, s)}</div>`] : []),
      ...(j.id === "self" ? [`<div class="ev"><time>after</time><span class="sm">you answered: photos are in Google Photos; music is a folder on lenin</span></div>`] : []),
      j.doneAt ? `<div class="ev"><time>${j.doneAt}</time><b>done</b> · ${esc(j.last)}${links(j.links)}</div>` : `<div class="ev"><time>${NOW}</time><span class="muted">working: ${esc(j.last)}</span></div>`,
    ];
    return `${top}<div class="seg"><button data-sub="">← all jobs</button><span class="muted sm" style="margin-left:auto">${esc(j.room)} · ${j.cost || "no cost yet"}</span></div>
      <div class="scroll" style="padding:.8rem"><div class="tl">${steps.join("")}</div>
      <div class="sm muted" style="margin-top:.8rem">The blog post, the session chat and the done note are this page. Older jobs keep it.</div></div>`;
  }
  const filt = s.flow === "find";
  const list = (st) => JOBS.filter((j) => (st === "done" ? j.st === "done" : st === "q" ? j.st === "q" : j.st === "busy") && (!filt || /self|host/.test(j.ask)));
  const pk = PKG.slice(0, 2).map((p) => `<div class="card ${p.hot && s.flow === "pkg" ? "need hl" : ""}"><div class="k">${p.via}</div><h5>${esc(p.n)}</h5><div class="sm">${pkgline(p, s)}</div>${p.hot && s.flow === "pkg" ? `<div class="opts"><button class="b">got it</button></div>` : ""}</div>`).join("");
  const box = `<div style="padding:.6rem .6rem 0"><div class="in"><span class="${s.flow === "talk" || filt ? "typed" : ""}">${filt ? "self-host" : s.flow === "talk" ? "push retry yes; the rest of the trip answers are in…" : "a new job for nadya, or search…"}</span><button class="b pri">${filt ? "search" : "ask"}</button></div>
    ${s.flow === "talk" ? `<div class="sm" style="margin:.35rem .2rem"><b>nadya</b>: saved the trip answers to your profile. Started nadya-a on push retry: <span class="lk" data-sub="job:push">new job ↓</span></div>` : ""}</div>`;
  const cols = [["q", "needs you"], ["busy", "running"], ["coming", "coming"], ["done", "done today"]];
  const tab = s.tab ?? (s.flow === "pkg" ? "coming" : s.flow === "done" || filt ? "done" : "q");
  const colHtml = (k) => k === "coming" ? `${pk}<div class="k muted" style="margin-top:.5rem">reminders</div>${REM.slice(0, 2).map((r) => `<div class="sm" style="padding:.15rem 0">${r.at} · ${esc(r.t)}</div>`).join("")}`
    : list(k).map((j) => jobCard(j, s)).join("") || `<div class="muted sm">nothing</div>`;
  const desk = `<div class="body donly">${cols.map(([k, h]) => `<div class="col scroll"><div class="h"><span>${h}</span><span>${k === "coming" ? 2 : list(k).length}</span></div>${colHtml(k)}</div>`).join("")}</div>`;
  const phone = `<div class="body ponly" style="flex-direction:column"><div class="scroll" style="padding:.6rem;flex:1">${colHtml(tab)}</div>
    <div class="tabbar">${cols.map(([k, h]) => `<button data-tab="${k}" aria-pressed="${tab === k}">${h}</button>`).join("")}</div></div>`;
  const toast = s.flow === "pkg" ? `<div class="toast">Dönerino is at the door (Uber Eats, 13:27)</div>` : "";
  return `${top}${box}${desk}${phone}${toast}`;
}

// ---------- 2. One conversation ----------
function talk(s) {
  const status = `<div class="sm muted" style="padding:.35rem .8rem;border-bottom:1px solid var(--line);display:flex;gap:.6rem;flex-wrap:wrap">
    <span>12:23 hourly · ${USE} · marx up · user at home</span><span class="lk" data-sub="sess">2 running: cc-a, cc-b</span><span>no reply for routine checks: this line changes</span></div>`;

  const idle = `<div class="grp">waiting on you</div>${["q1", "q2"].map((k) => s.flow === "ask" && s.open === k || (s.flow === "ask" && k === "q2" && !s.open) ? qcard(k, s, "hl") : `<div class="row" data-open="${k}">${dot("q")}<span class="t">${esc(Q[k].t)}</span><time>${Q[k].from.split(",")[0]}</time></div>`).join("")}
    <div class="grp">recent</div>${JOBS.filter((j) => j.st === "done").slice(0, 4).map((j) => `<div class="row">${dot("ok")}<span class="t">${esc(j.last)}</span><time>${j.doneAt}</time></div>`).join("")}`;

  if (s.flow === "find") res = `<div class="row" style="background:var(--cur)"><span class="t"><b>↵ ask nadya</b> "self-host"</span></div>` +

    <div class="grp">sessions</div><div class="row"><span class="t">design-a-a (closed 09:28)</span></div><div class="row"><span class="t">design-a-b (closed 10:49)</span></div><div class="grp">files</div><div class="row"><span class="t">~/web/design-a/reports/1-14.html</span></div>`;
  if (s.flow === "talk") res = `<div class="row" style="background:var(--cur)"><span class="t"><b>↵ ask nadya</b></span></div><div class="card"><div class="k">nadya · 13:06</div>Three for you: Sun 10:10 check-in AC 407, Sun 18:00 Katrina's list, the ~/ai backup question. Mon 07:30 I park the hard queue and stop marx agents.<div class="opts"><button class="b">continue in nadya's chat</button><button class="b">pin</button></div></div>`;

    chat: `${chat}<div class="in" style="margin-top:.6rem"><span>to nadya, about ${esc(r.n)}…</span></div>`,

    later: `<div class="sm">ideas, reminders and open report questions tagged ${esc(r.id)}</div>`,

}

    org: [["nadya and helpers", ["every message, post, reminder and log line carries a room: the project name burn.js already computes from the dir", "a message from a room arrives as <code>[room cc] ...</code>; nadya replies in the same room", "nadya opens a room for a temporary topic (trip, taxes) as <code>projects/&lt;name&gt;.md</code>"]],
      ["files", ["<code>~/nadya/CLAUDE.md</code>: room tag on replies", "<code>~/nadya/todo/reminders.md</code> format: <code>#room</code>", "<code>~/nadya/projects/*.md</code>: the room's header doc", "<code>host/burn.js</code> <code>projectName()</code> reused by cc"]],
      ["new data", ["a room per item; mostly derived (blog posts already name the project)"]],
      ["drops", ["blog, plan, projects and files tabs as separate places"]]]},
  {id: "day", n: "5. The day", lede: "The unit is time. One vertical line for today: what is coming above, what happened below, the now line holds what waits on you.", r: day,
    caps: {open: "Session lanes on top (desktop), then the day: parcels, reminders and the flight above now, results below. Hourly checks are folded.",
      done: "A result sits at its time with its links; its session is the lane above.",
      ask: "Questions are pinned to the now line until answered; they move with it.",
      find: "Search puts marks on the timeline and jumps between days.",
      pkg: "The ETA row at 13:28 becomes \"at the door\" on the now line.",
      talk: "The box at the now line; your message and its result are placed at their times."},
    org: [["nadya and helpers", ["nadya-log.md lines get a fixed shape <code>HH:MM kind who: text [links]</code> (most already are)", "hourly writes only to the log; cc folds those lines", "the day page replaces the daily/days digests for the user"]],
      ["files", ["<code>~/nadya/CLAUDE.md</code>: log line format", "<code>~/nadya/cron/hourly.md</code>: no chat reply", "<code>web/api/</code> lemon box: <code>api/day?date=</code> from nadya-log, blog, reminders, tracker ETAs, cchost session starts and ends"]],
      ["new data", ["session start/end per day (api/changes has them live; a log keeps them)"]],
      ["drops", ["blog and plan as tabs; sessions list becomes the lanes"]]]},
];

const S = Object.fromEntries(DIRS.map((d) => [d.id, {flow: "open", ph: false}]));
const M = document.getElementById("m");
M.innerHTML = DIRS.map((d) => `<section id="${d.id}"><h2>${d.n}</h2><p class="lede">${d.lede}</p>
  <div class="ctl" data-d="${d.id}">${FLOWS.map(([k, t]) => `<button data-flow="${k}">${t}</button>`).join("")}<span class="sp"></span><button data-ph="0">desktop</button><button data-ph="1">phone</button></div>
  <div class="stage"><div class="fr" data-d="${d.id}"></div></div><p class="cap" data-cap="${d.id}"></p>
  <details class="org" open><summary>what changes around it</summary>${d.org.map(([h, l]) => `<h4>${h}</h4><ul>${l.map((x) => `<li>${x}</li>`).join("")}</ul>`).join("")}</details></section>`).join("") + `
<section id="compare"><h2>Compare</h2>
<table style="border-collapse:collapse;font-size:.88rem;background:#fff">
<thead><tr>${["", "unit", "first screen", "where a question waits", "how you find old things", "new data", "cost"].map((h) => `<th style="text-align:left;border-bottom:1px solid var(--line);padding:.3rem .5rem">${h}</th>`).join("")}</tr></thead><tbody>
${[["1 jobs", "a request", "4 columns", "on its job card", "search jobs", "jobs.jsonl", "large"],
  ["2 conversation", "a message", "nadya's thread", "a card that stays", "ask nadya", "card markers, status.json", "medium"],
  ["3 command bar", "a search hit", "an empty box", "under the box", "type", "api/find index", "medium"],
  ["4 rooms", "a project", "room tiles", "in the room's chat", "filter rooms", "a room tag everywhere", "large"],
  ["5 the day", "a time", "today's line", "at the now line", "marks by date", "log line format, api/day", "medium"]]
  .map((r) => `<tr>${r.map((c, i) => `<td style="padding:.3rem .5rem;border-bottom:1px solid var(--line)">${i ? c : `<b>${c}</b>`}</td>`).join("")}</tr>`).join("")}
</tbody></table>
<p class="sm">They combine: 3's box fits on top of 1, 4 or 5; 2's cards can be what 1's job page and 5's rows are made of.</p></section>
<section id="insp" class="insp"><h2>Inspiration</h2><ol>
${[["https://dribbble.com/shots/27320546-AI-Agent-Control-Centre-Dashboard", "Agent Control Centre", "each agent is a card; its pending confirmation is answered inside that card (1, 3)"],
  ["https://dribbble.com/shots/27744383-Agent-Control-Room-AI-Agent-Dashboard", "Agent Control Room", "agents as rows with live status, a side column of questions waiting (5's lanes)"],
  ["https://dribbble.com/shots/27449133-proactive-ai-your-assistant-before-you-ask", "proactive ai", "\"Iceland trip: all your requests on one canvas\": a topic collects every request about it (4, the trip room)"],
  ["https://dribbble.com/shots/27748175-AI-Personal-Assistant-Life-Admin-App-UI", "Lumi", "the agent's steps as a checklist while it works; a separate \"activity and done\" screen with pending below (1's job page)"],

  ["https://dribbble.com/shots/27509461-AI-Task-Automation-UX-for-SaaS-Founders-Relay", "Relay, first extraction", "the assistant proposes tasks it found in conversations; you approve or skip each (dream's asks)"],
  ["https://dribbble.com/shots/27611415-Macro-Dashboard-Redesign", "Macro", "the home screen is a greeting and one input, nothing else (3)"],
  ["https://dribbble.com/shots/26734499-AI-Command-Bar-Smart-In-App-Search-UI", "AI Command Bar", "one bar for search and commands (3)"],
  ["https://dribbble.com/shots/27206757-Meeting-search-AI-agent-toggle", "Meeting search", "results split into recent and upcoming around now (5)"],
  ["https://dribbble.com/shots/27603629-Atlas-AI-Search-for-Call-Center-CRM-AI-Agent-Dashboard", "Atlas search", "a palette over every record type, grouped by kind (3's find)"],
  ["https://dribbble.com/shots/26165152-Daily-Briefing-Mobile-Agenda-App", "Daily Briefing agenda", "the day as one list with the current time inside it (5)"],

  ["https://www.hey.com/features/the-imbox/", "HEY Imbox, Feed, Paper Trail", "three places by what an item asks of you (1's columns)"],

function draw(id) {
  const d = DIRS.find((x) => x.id === id), s = S[id];
  const fr = M.querySelector(`.fr[data-d="${id}"]`);
  fr.classList.toggle("ph", s.ph);
  fr.innerHTML = d.r(s);
  M.querySelectorAll(`.ctl[data-d="${id}"] button`).forEach((b) => b.setAttribute("aria-pressed", b.dataset.flow ? b.dataset.flow === s.flow : String(+s.ph) === b.dataset.ph));
  M.querySelector(`[data-cap="${id}"]`).textContent = d.caps[s.flow] + (s.flow === "pkg" ? " (The 13:28 ETA is the tracker's; the arrival is written for the mock.)" : "");
}
M.addEventListener("click", (e) => {
  const sec = e.target.closest("section")?.id;
  if (!S[sec]) return;
  const s = S[sec], t = e.target.closest("[data-flow],[data-ph],[data-sub],[data-tab],[data-answer],[data-open]");
  if (!t) return;
  const {flow, ph, sub, tab, answer, pick, open} = t.dataset;
  if (flow) Object.assign(s, {flow, sub: START[sec]?.[flow] ?? "", tab: undefined, answered: undefined, open: undefined});
  if (ph) s.ph = ph === "1";
  if (sub !== undefined) Object.assign(s, {sub, tab: undefined});
  if (tab) s.tab = tab;
  if (answer) Object.assign(s, {answered: answer, pick});
  if (open) s.open = open;
  draw(sec);
});
// which screen a flow opens on, where it is not the main one
const START = {jobs: {done: "job:self", ask: "job:grep"}, rooms: {done: "design-a", ask: "cc", talk: "cc"}, talk: {}, bar: {}, day: {}};
DIRS.forEach((d) => draw(d.id));
</script>
