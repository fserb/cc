daemon off;
error_log /dev/stderr warn;
events {}
http {
  access_log off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 7681;
    location / {
      proxy_pass http://127.0.0.1:7682;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      # ttyd -H can't read X-Forwarded-For (a built-in libwebsockets header),
      # so copy it to a custom one. Overwrites anything the client sent.
      proxy_set_header X-Term-Ip $http_x_forwarded_for;
      proxy_read_timeout 1d;
      proxy_send_timeout 1d;
    }
  }
}
